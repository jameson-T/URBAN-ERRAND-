  /* ================= PHASE 4 — Merchant Interface ================= */
  let currentProductId = null;

  const MERCH_PENDING = ['REQUESTED','AGENT_SELECTED','MERCHANT_CONFIRMATION_REQUIRED','PRICE_CHANGE_REQUESTED','PRICE_CHANGE_REJECTED'];
  const MERCH_ACTIVE = ['MERCHANT_CONFIRMED','PREPARING','READY_FOR_PICKUP','GOING_TO_SELLER','AGENT_ARRIVED','PICKED_UP','IN_TRANSIT','ARRIVED_AT_CUSTOMER'];
  const MERCH_DONE = ['DELIVERED','PAYMENT_CONFIRMED','COMPLETED'];
  const MERCH_FAIL = ['ITEM_UNAVAILABLE','CANCELLED','AGENT_CANCELLED','CUSTOMER_UNAVAILABLE','DISPUTED'];
  const PRODUCT_CATEGORIES = ['Grocery','Household','Electronics','Pharmacy','Beauty','Fashion','Restaurant','Other'];

  function myMerchantErrands(){
    return errands.filter(e=> e.sellerId===currentUser.id).sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
  }
  function myProducts(){ return products.filter(p=> p.merchantId===currentUser.id); }
  function merchantOwnsErrand(e){ return !!e && !!currentUser && e.sellerId === currentUser.id; }
  function shortId(e){ return '#' + String(e.id).slice(-6).toUpperCase(); }
  function saveCurrentMerchantUser(){
    const idx = users.findIndex(u=>u.id===currentUser.id);
    if(idx>-1) users[idx] = currentUser;
    saveUsers(); saveSession();
  }
  function merchantStatus(e){
    const st = e.status;
    if(st==='REQUESTED' || st==='AGENT_SELECTED') return { label:'New', cls:'pending' };
    if(st==='MERCHANT_CONFIRMATION_REQUIRED') return { label:'Awaiting Confirmation', cls:'pending' };
    if(st==='PRICE_CHANGE_REQUESTED') return { label:'Price Change Requested', cls:'pending' };
    if(st==='PRICE_CHANGE_REJECTED') return { label:'Price Change Rejected', cls:'cancelled' };
    if(st==='MERCHANT_CONFIRMED') return { label:'Confirmed', cls:'live' };
    if(st==='PREPARING') return { label:'Preparing', cls:'live' };
    if(st==='READY_FOR_PICKUP') return { label:'Ready for Pickup', cls:'live' };
    if(st==='GOING_TO_SELLER') return { label:'Agent On The Way', cls:'live' };
    if(st==='AGENT_ARRIVED') return { label:'Agent Arrived', cls:'live' };
    if(['PICKED_UP','IN_TRANSIT','ARRIVED_AT_CUSTOMER'].includes(st)) return { label:'Picked Up', cls:'live' };
    if(MERCH_DONE.includes(st)) return { label:'Completed', cls:'done' };
    if(st==='ITEM_UNAVAILABLE') return { label:'Item Unavailable', cls:'cancelled' };
    if(MERCH_FAIL.includes(st)) return { label:'Cancelled', cls:'cancelled' };
    return { label: STATUS_META[st] || st, cls:'live' };
  }
  function merchantStepIndex(st){
    if(st==='MERCHANT_CONFIRMED') return 1;
    if(st==='PREPARING') return 2;
    if(st==='READY_FOR_PICKUP' || st==='GOING_TO_SELLER') return 3;
    if(st==='AGENT_ARRIVED') return 4;
    if(['PICKED_UP','IN_TRANSIT','ARRIVED_AT_CUSTOMER','DELIVERED','PAYMENT_CONFIRMED','COMPLETED'].includes(st)) return 5;
    return 0;
  }
  function merchantAdvance(e, next, note){
    e.status = next;
    pushHistory(e, next, note || '');
    saveErrands();
  }
  function notifyErrandParties(e, title, msg, type){
    if(e.buyerId) pushNotificationFor(e.buyerId, title, msg, type || 'update');
    if(e.agentId) pushNotificationFor(e.agentId, title, msg, 'agent-update');
  }
  function reasonDialog(title, msg, confirmLabel, onConfirm, presets){
    const el = document.createElement('div');
    el.className = 'call-overlay';
    el.style.background = 'rgba(8,25,35,0.72)';
    el.style.justifyContent = 'center';
    const chips = (presets && presets.length) ? '<div class="chip-select" style="margin-bottom:12px;">' + presets.map((p,i)=>'<span class="chip-option" data-preset="' + i + '">' + escHtml(p) + '</span>').join('') + '</div>' : '';
    el.innerHTML = '<div class="form-card" style="max-width:460px;text-align:left;max-height:90vh;overflow:auto;"><h1 class="screen-title">' + title + '</h1><p class="screen-sub">' + msg + '</p>' + chips + '<div class="field"><label for="rd-reason">Reason</label><textarea id="rd-reason" rows="3" placeholder="Required"></textarea></div><div class="wizard-actions"><button class="btn btn-outline" data-x>Cancel</button><button class="btn btn-primary" data-ok>' + confirmLabel + '</button></div></div>';
    document.body.appendChild(el);
    const ta = el.querySelector('#rd-reason');
    el.querySelectorAll('[data-preset]').forEach(ch=> ch.addEventListener('click', ()=>{
      el.querySelectorAll('[data-preset]').forEach(c=>c.classList.remove('selected'));
      ch.classList.add('selected');
      const pr = presets[Number(ch.getAttribute('data-preset'))];
      ta.value = (pr === 'Other') ? '' : pr;
      ta.classList.remove('invalid'); ta.focus();
    }));
    el.querySelector('[data-x]').onclick = ()=> el.remove();
    el.querySelector('[data-ok]').onclick = ()=>{
      const reason = ta.value.trim();
      if(!reason){ ta.classList.add('invalid'); return; }
      el.remove();
      onConfirm(reason);
    };
  }
  function confirmDialog(title, msg, confirmLabel, onConfirm){
    const el = document.createElement('div');
    el.className = 'call-overlay';
    el.style.background = 'rgba(8,25,35,0.72)';
    el.style.justifyContent = 'center';
    el.innerHTML = `<div class="form-card" style="max-width:420px;text-align:left;"><h1 class="screen-title">${title}</h1><p class="screen-sub">${msg}</p><div class="wizard-actions"><button class="btn btn-outline" data-x>Cancel</button><button class="btn btn-primary" data-ok>${confirmLabel}</button></div></div>`;
    document.body.appendChild(el);
    el.querySelector('[data-x]').onclick = ()=> el.remove();
    el.querySelector('[data-ok]').onclick = ()=>{ el.remove(); onConfirm(); };
  }
  function merchantAvatarHTML(size){
    const u = currentUser;
    const px = size || 56;
    if(u.logoUrl){ return `<img class="product-thumb" src="${u.logoUrl}" alt="logo" style="width:${px}px;height:${px}px;border-radius:14px;">`; }
    return `<div class="avatar" style="width:${px}px;height:${px}px;font-size:${Math.round(px/3)}px;border-radius:14px;">${initials(u.businessName || u.fullName || 'M')}</div>`;
  }
  function merchantOrderCardHTML(e){
    const agent = findAgent(e.agentId);
    const ms = merchantStatus(e);
    return `
      <div class="order-card">
        <div class="order-card-top"><span class="order-card-item">${escHtml(e.itemName)}</span><span class="status-chip ${ms.cls}"><span class="dot"></span>${ms.label}</span></div>
        <div class="order-card-meta">
          Order ${shortId(e)} · Qty ${e.quantity||1}<br>
          Customer: <b>${escHtml(e.buyerName||'Customer')}</b><br>
          ${agent ? agentTypeLabel(agent.type)+': '+escHtml(agent.name) : 'No agent selected yet'}<br>
          <span class="price-strong">${fmtNaira(e.estimatedPrice)}</span> est. item price
        </div>
        <div class="order-card-bottom">
          <span style="font-size:12px;color:var(--text-secondary);">${timeAgo(e.createdAt)}</span>
          <button class="btn btn-primary" data-m-order="${e.id}">${e.status==='MERCHANT_CONFIRMATION_REQUIRED' ? 'Confirm Item' : 'View Request'}</button>
        </div>
      </div>`;
  }
  function wireMerchantOrderCards(container){
    container.querySelectorAll('[data-m-order]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ currentOrderId = btn.getAttribute('data-m-order'); go('merchant-order-detail'); });
    });
  }

  /* ---- Dashboard ---- */
  SCREENS['merchant-dashboard'] = function(root){
    const mine = myMerchantErrands();
    const pending = mine.filter(e=> MERCH_PENDING.includes(e.status));
    const active = mine.filter(e=> MERCH_ACTIVE.includes(e.status));
    const done = mine.filter(e=> MERCH_DONE.includes(e.status));
    const itemsSold = done.reduce((s,e)=> s + (Number(e.quantity)||1), 0);
    const todayCount = mine.filter(e=> isToday(e.createdAt)).length;
    const weekCount = mine.filter(e=> Date.now() - new Date(e.createdAt).getTime() < 7*86400000).length;
    const totalSales = done.reduce((s,e)=> s + (Number(e.estimatedPrice)||0), 0);
    const open = currentUser.isOpen !== false;
    root.innerHTML = `
      <div class="profile-hero">
        ${merchantAvatarHTML(60)}
        <div style="flex:1;min-width:0;">
          <div class="profile-hero-name">${escHtml(currentUser.businessName || 'Your Store')}</div>
          <div class="profile-hero-meta">${escHtml(currentUser.category || 'Merchant')} · ${open ? '<span class="open-tag">🟢 Open</span>' : '<span class="closed-tag">Closed</span>'}</div>
        </div>
        <button class="btn btn-outline" id="quick-store-toggle" style="width:auto;padding:9px 14px;">${open ? 'Close Store' : 'Open Store'}</button>
      </div>
      <div class="section-heading"><h2>Overview</h2></div>
      <div class="summary-grid">
        <div class="stat-box"><b>${pending.length}</b><span>Pending Errands</span></div>
        <div class="stat-box"><b>${active.length}</b><span>Active Errands</span></div>
        <div class="stat-box"><b>${done.length}</b><span>Completed Errands</span></div>
        <div class="stat-box"><b>${itemsSold}</b><span>Items Sold Through Urban Errand</span></div>
        <div class="stat-box"><b>${todayCount}</b><span>Today's Orders</span></div>
        <div class="stat-box"><b>${weekCount}</b><span>This Week's Orders</span></div>
      </div>
      <div class="stat-box" style="margin-top:10px;text-align:left;padding:16px 18px;"><span>Total sales through Urban Errand</span><b style="font-size:20px;">${fmtNaira(totalSales)}</b></div>
      <div class="section-heading"><h2>Pending Errands</h2><button class="link-btn" data-nav="merchant-orders">See all</button></div>
      <div id="m-pending-slot"></div>
      <div class="section-heading"><h2>Active Errands</h2></div>
      <div id="m-active-slot"></div>
    `;
    root.querySelectorAll('[data-nav]').forEach(b=> b.addEventListener('click', ()=> go(b.getAttribute('data-nav'))));
    root.querySelector('#quick-store-toggle').addEventListener('click', ()=>{
      const nowOpen = currentUser.isOpen === false;
      currentUser.isOpen = nowOpen;
      currentUser.storeStatus = nowOpen ? 'open' : 'closed';
      saveCurrentMerchantUser();
      toast(nowOpen ? 'Store is now open.' : 'Store closed. Customers will see "Store currently closed."');
      render('merchant-dashboard');
    });
    const ps = root.querySelector('#m-pending-slot');
    if(!pending.length){
      ps.innerHTML = `<div class="active-errand-card"><div class="empty-state"><div class="empty-icon">${ICON.orders}</div><p><strong style="color:var(--text);">No pending errands</strong><br>New customer requests will appear here.</p></div></div>`;
    } else { ps.innerHTML = pending.slice(0,3).map(merchantOrderCardHTML).join(''); wireMerchantOrderCards(ps); }
    const as = root.querySelector('#m-active-slot');
    if(!active.length){
      as.innerHTML = `<div class="active-errand-card"><div class="empty-state"><p style="margin:0;">No active errands right now.</p></div></div>`;
    } else { as.innerHTML = active.slice(0,3).map(merchantOrderCardHTML).join(''); wireMerchantOrderCards(as); }
  };

  /* ---- Incoming Orders ---- */
  SCREENS['merchant-orders'] = function(root){
    const mine = myMerchantErrands();
    const filters = [
      ['all','All'], ['new','New'], ['awaiting','Awaiting Confirmation'], ['active','Active'], ['completed','Completed'], ['cancelled','Cancelled']
    ];
    root.innerHTML = pageHeader('Incoming Errands') + `
      <div style="display:flex;justify-content:flex-end;margin:-10px 0 12px;"><button class="link-btn" id="m-go-history" style="font-size:13px;font-weight:700;color:var(--green-600);background:none;border:none;">Order History →</button></div>
      <div class="tab-row" id="m-order-tabs">${filters.map((f,i)=>`<button class="tab-btn${i===0?' active':''}" data-f="${f[0]}">${f[1]}</button>`).join('')}</div>
      <div id="m-orders-list"></div>
    `;
    wirePageBack(root);
    root.querySelector('#m-go-history').addEventListener('click', ()=> go('merchant-history'));
    const target = root.querySelector('#m-orders-list');
    function paint(f){
      let list = mine;
      if(f==='new') list = mine.filter(e=> ['REQUESTED','AGENT_SELECTED'].includes(e.status));
      else if(f==='awaiting') list = mine.filter(e=> ['MERCHANT_CONFIRMATION_REQUIRED','PRICE_CHANGE_REQUESTED','PRICE_CHANGE_REJECTED'].includes(e.status));
      else if(f==='active') list = mine.filter(e=> MERCH_ACTIVE.includes(e.status));
      else if(f==='completed') list = mine.filter(e=> MERCH_DONE.includes(e.status));
      else if(f==='cancelled') list = mine.filter(e=> MERCH_FAIL.includes(e.status));
      if(!list.length){
        target.innerHTML = `<div class="empty-state"><div class="empty-icon">${ICON.orders}</div><p>${f==='completed' ? 'Completed errands will appear here.' : 'New customer requests will appear here.'}</p></div>`;
        return;
      }
      target.innerHTML = list.map(merchantOrderCardHTML).join('');
      wireMerchantOrderCards(target);
    }
    paint('all');
    root.querySelectorAll('#m-order-tabs [data-f]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        root.querySelectorAll('#m-order-tabs [data-f]').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        paint(btn.getAttribute('data-f'));
      });
    });
  };

  /* ---- Order Details ---- */
  SCREENS['merchant-order-detail'] = function(root){
    const e = errands.find(x=>x.id===currentOrderId);
    if(!e || !merchantOwnsErrand(e)){
      root.innerHTML = pageHeader('Order') + `<div class="empty-state"><p>This order isn't available to your store.</p></div>`;
      wirePageBack(root);
      return;
    }
    renderMerchantOrder(root, e);
  };

  function merchantActionHTML(e, agent){
    const st = e.status, pc = e.priceChange || {};
    if(['REQUESTED','AGENT_SELECTED'].includes(st)){
      return `<div class="active-errand-card"><p style="font-size:13px;color:var(--text-secondary);margin:0;">Waiting for the selected agent to accept this errand. You'll be asked to confirm the item once they do.</p></div>`;
    }
    if(st === 'MERCHANT_CONFIRMATION_REQUIRED'){
      return `
        <div class="active-errand-card">
          <div class="section-heading" style="margin-top:0;"><h2>Confirm this request</h2></div>
          <div class="field"><label for="m-actual-price">Actual price (leave blank if it matches ${fmtNaira(e.estimatedPrice)})</label><input id="m-actual-price" type="number" min="0" placeholder="${e.estimatedPrice}"></div>
          <p style="font-size:12.5px;color:var(--text-secondary);margin:0 0 14px;">If you enter a different price, the customer must approve it before the errand continues.</p>
          <div class="wizard-actions"><button class="btn btn-outline" id="m-unavail-btn">Item Unavailable</button><button class="btn btn-primary" id="m-confirm-btn">Confirm Item Available</button></div>
          <div id="m-unavail-form" class="hidden" style="margin-top:18px;border-top:1px solid var(--border);padding-top:16px;">
            <div class="field"><label for="m-un-reason">Reason</label><input id="m-un-reason" type="text" placeholder="e.g. Out of stock"></div>
            <div class="field"><label for="m-un-alt">Alternative product (optional)</label><input id="m-un-alt" type="text" placeholder="e.g. Peak Milk 900g"></div>
            <div class="field"><label for="m-un-altprice">Alternative price (optional)</label><input id="m-un-altprice" type="number" min="0"></div>
            <button class="btn btn-primary" id="m-un-send">Notify Customer &amp; Agent</button>
          </div>
        </div>`;
    }
    if(st === 'PRICE_CHANGE_REQUESTED'){
      if(pc.status === 'approved'){
        return `<div class="active-errand-card"><div class="section-heading" style="margin-top:0;"><h2>Price Approved</h2></div><p style="font-size:13px;color:var(--text-secondary);margin:0 0 14px;">${escHtml(e.buyerName||'The customer')} approved ${fmtNaira(pc.actual)}.</p><button class="btn btn-primary" id="m-price-continue">Continue</button></div>`;
      }
      if(pc.status === 'rejected'){
        return `<div class="active-errand-card"><div class="section-heading" style="margin-top:0;"><h2>Price Rejected</h2></div><p style="font-size:13px;color:var(--text-secondary);margin:0 0 14px;">${escHtml(e.buyerName||'The customer')} rejected ${fmtNaira(pc.actual)}. You can keep the original price or cancel.</p><div class="wizard-actions"><button class="btn btn-outline" id="m-cancel-btn">Cancel Order</button><button class="btn btn-primary" id="m-keep-orig">Keep ${fmtNaira(pc.estimated)}</button></div></div>`;
      }
      return `<div class="active-errand-card"><div class="section-heading" style="margin-top:0;"><h2>Price Change Requested</h2></div><div class="review-row"><span class="r-label">Estimated</span><span class="r-value">${fmtNaira(pc.estimated)}</span></div><div class="review-row"><span class="r-label">Confirmed by you</span><span class="r-value price-strong">${fmtNaira(pc.actual)}</span></div><p style="font-size:13px;color:var(--text-secondary);margin:12px 0 0;">Waiting for ${escHtml(e.buyerName||'the customer')} to approve. The order can't continue until they do.</p></div>`;
    }
    if(st === 'MERCHANT_CONFIRMED'){
      return `<button class="btn btn-primary" id="m-prepare-btn">Preparing Order</button>`;
    }
    if(st === 'PREPARING'){
      return `<button class="btn btn-primary" id="m-ready-btn">Ready for Pickup</button>`;
    }
    if(st === 'READY_FOR_PICKUP' || st === 'GOING_TO_SELLER'){
      const demoAgent = agent && !agent.isRealUser;
      return `<div class="active-errand-card"><p style="font-size:13px;color:var(--text-secondary);margin:0 0 ${demoAgent?'14':'0'}px;">${st==='GOING_TO_SELLER' ? escHtml(agent?agent.name:'The agent')+' is on the way to your store.' : 'Order is ready. Waiting for the agent to head to your store.'}</p>${demoAgent ? '<button class="btn btn-outline" id="m-sim-arrive">Simulate Agent Arrival (demo)</button>' : ''}</div>`;
    }
    if(st === 'AGENT_ARRIVED'){
      const arrived = (e.statusHistory||[]).slice().reverse().find(h=>h.status==='AGENT_ARRIVED');
      return `
        <div class="active-errand-card">
          <div class="section-heading" style="margin-top:0;"><h2>Agent has arrived</h2></div>
          <p style="font-size:13px;color:var(--text-secondary);margin:0 0 12px;">${escHtml(agent?agent.name:'The agent')} · ${agent?agentTypeLabel(agent.type):''}${agent&&agent.transport?' · '+agent.transport:''}${agent&&agent.verified?' · ✓ Verified':''}${arrived?'<br>Arrived '+timeAgo(arrived.timestamp):''}</p>
          <div class="review-block" style="margin-bottom:14px;">
            <div class="review-row"><span class="r-label">Item</span><span class="r-value">${escHtml(e.itemName)}</span></div>
            <div class="review-row"><span class="r-label">Quantity</span><span class="r-value">${e.quantity||1}</span></div>
            <div class="review-row"><span class="r-label">Confirmed price</span><span class="r-value price-strong">${fmtNaira(e.estimatedPrice)}</span></div>
            <div class="review-row"><span class="r-label">Order ID</span><span class="r-value">${shortId(e)}</span></div>
            <div class="review-row"><span class="r-label">Agent</span><span class="r-value">${escHtml(agent?agent.name:'—')}</span></div>
          </div>
          <div class="file-drop" id="m-handoff-drop"><div class="file-drop-icon">${ICON.camera2}</div><div class="file-drop-text"><strong>Add handoff photo</strong>Optional</div></div>
          <input type="file" id="m-handoff-input" accept="image/*" style="display:none;">
          <button class="btn btn-primary" id="m-handoff-btn" style="margin-top:14px;">Confirm Handoff</button>
        </div>`;
    }
    if(['PICKED_UP','IN_TRANSIT','ARRIVED_AT_CUSTOMER','DELIVERED','PAYMENT_CONFIRMED','COMPLETED'].includes(st) && e.handoff){
      return `<div class="active-errand-card"><div class="section-heading" style="margin-top:0;"><h2>Handed over</h2></div><p style="font-size:13px;color:var(--text-secondary);margin:0;">You handed this order to ${escHtml(agent?agent.name:'the agent')} ${timeAgo(e.handoff.time)}.</p>${e.handoff.photo?`<img src="${e.handoff.photo}" alt="handoff" style="max-width:220px;width:100%;border-radius:12px;margin-top:12px;">`:''}</div>`;
    }
    if(st === 'ITEM_UNAVAILABLE' && e.unavailable){
      return `<div class="active-errand-card"><div class="section-heading" style="margin-top:0;"><h2>Item Unavailable</h2></div><div class="review-row"><span class="r-label">Reason</span><span class="r-value">${escHtml(e.unavailable.reason)}</span></div>${e.unavailable.alternative?`<div class="review-row"><span class="r-label">Alternative</span><span class="r-value">${escHtml(e.unavailable.alternative)}${e.unavailable.altPrice?' · '+fmtNaira(e.unavailable.altPrice):''}</span></div>`:''}</div>`;
    }
    return '';
  }

  function renderMerchantOrder(root, e){
    const agent = findAgent(e.agentId);
    const ms = merchantStatus(e);
    const stepIdx = merchantStepIndex(e.status);
    const steps = ['Requested','Confirmed','Preparing','Ready for Pickup','Agent Arrived','Picked Up'];
    const cancellable = MERCH_PENDING.includes(e.status) || ['MERCHANT_CONFIRMED','PREPARING','READY_FOR_PICKUP'].includes(e.status);
    root.innerHTML = pageHeader('Order ' + shortId(e)) + `
      <div class="tracking-status-card">
        <div class="tracking-status-icon">${ICON.bag}</div>
        <div style="flex:1;"><div style="font-weight:700;font-size:14.5px;color:var(--text);">${escHtml(e.itemName)}</div><div style="font-size:12.5px;color:var(--text-secondary);">Requested ${timeAgo(e.createdAt)}</div></div>
        <span class="status-chip ${ms.cls}"><span class="dot"></span>${ms.label}</span>
      </div>
      <div class="section-heading"><h2>Progress</h2></div>
      <div class="active-errand-card" style="margin-bottom:20px;">
        <div class="progress-vertical">
          ${steps.map((label,i)=>`<div class="pv-step ${i<stepIdx?'done':i===stepIdx?'current':''}"><div class="pv-dot">${i<stepIdx?ICON.checkSm:''}</div><div class="pv-label">${i<=stepIdx?'✓ ':'○ '}${label}</div></div>`).join('')}
        </div>
      </div>
      <div id="m-action-slot">${merchantActionHTML(e, agent)}</div>
      <div class="section-heading"><h2>Customer</h2></div>
      <div class="active-errand-card" style="margin-bottom:20px;">
        <div style="display:flex;gap:14px;align-items:center;">
          <div class="avatar">${initials(e.buyerName||'C')}</div>
          <div style="flex:1;"><div style="font-weight:700;font-size:14.5px;color:var(--text);">${escHtml(e.buyerName||'Customer')}</div><div style="font-size:12.5px;color:var(--text-secondary);">${escHtml(e.buyerPhone||'')}</div></div>
        </div>
        <div class="profile-actions"><button class="btn btn-outline" id="m-chat-btn" style="width:auto;">Chat</button><button class="btn btn-outline" id="m-call-cust" style="width:auto;">Call</button></div>
      </div>
      <div class="section-heading"><h2>Requested Item</h2></div>
      <div class="review-block">

  function wireMerchantOrder(root, e, agent){
    const redraw = ()=> renderMerchantOrder(document.getElementById('app-content'), e);
    const q = sel => root.querySelector(sel);
    const chatBtns = ['#m-chat-btn','#m-chat-agent'];
    chatBtns.forEach(sel=>{ const b = q(sel); if(b) b.addEventListener('click', ()=>{ currentChatErrandId = e.id; go('merchant-chat'); }); });
    if(q('#m-call-cust')) q('#m-call-cust').addEventListener('click', ()=> openCallOverlay({ name: e.buyerName || 'Customer' }));
    if(q('#m-call-agent')) q('#m-call-agent').addEventListener('click', ()=> openCallOverlay({ name: agent ? agent.name : 'Agent' }));

    if(q('#m-unavail-btn')) q('#m-unavail-btn').addEventListener('click', ()=>{ q('#m-unavail-form').classList.toggle('hidden'); });
    if(q('#m-un-send')) q('#m-un-send').addEventListener('click', ()=>{
      const reason = q('#m-un-reason').value.trim();
      if(!reason){ toast('Please give a reason.'); return; }
      const alt = q('#m-un-alt').value.trim();
      const altPrice = Number(q('#m-un-altprice').value) || null;
      e.unavailable = { reason, alternative: alt, altPrice, at: new Date().toISOString() };
      merchantAdvance(e, 'ITEM_UNAVAILABLE', reason);
      notifyErrandParties(e, 'Item Unavailable', `${e.sellerName} can't supply ${e.itemName}: ${reason}.` + (alt ? ' Suggested alternative: ' + alt + '.' : ''), 'update');
      toast('Customer and agent notified.');
      redraw();
    });
    if(q('#m-confirm-btn')) q('#m-confirm-btn').addEventListener('click', ()=>{
      const raw = q('#m-actual-price').value.trim();
      const actual = raw === '' ? null : Number(raw);
      if(actual !== null && (isNaN(actual) || actual < 0)){ toast('Enter a valid price.'); return; }
      if(actual !== null && actual !== Number(e.estimatedPrice)){
        e.priceChange = { estimated: e.estimatedPrice, actual, status:'requested', by:'merchant' };
        merchantAdvance(e, 'PRICE_CHANGE_REQUESTED', 'Merchant price ' + actual);
        if(e.buyerId) pushNotificationFor(e.buyerId, 'Price Changed', `${e.sellerName} has confirmed a price of ${fmtNaira(actual)}. Please approve or reject.`, 'price-change');
        if(e.agentId) pushNotificationFor(e.agentId, 'Price Change Requested', 'The merchant requested a price change. Waiting for the customer.', 'agent-update');
        toast('Price change sent to the customer.');
      } else {
        merchantAdvance(e, 'MERCHANT_CONFIRMED');
        notifyErrandParties(e, 'Item Confirmed', `${e.sellerName} confirmed ${e.itemName} is available.`, 'update');
        toast('Item confirmed.');
      }
      redraw();
    });
    if(q('#m-price-continue')) q('#m-price-continue').addEventListener('click', ()=>{
      e.estimatedPrice = e.priceChange.actual;
      merchantAdvance(e, 'MERCHANT_CONFIRMED');
      notifyErrandParties(e, 'Item Confirmed', `${e.sellerName} confirmed ${e.itemName} at ${fmtNaira(e.estimatedPrice)}.`, 'update');
      redraw();
    });
    if(q('#m-keep-orig')) q('#m-keep-orig').addEventListener('click', ()=>{
      merchantAdvance(e, 'MERCHANT_CONFIRMED', 'Kept original price');
      notifyErrandParties(e, 'Item Confirmed', `${e.sellerName} confirmed ${e.itemName} at the original price of ${fmtNaira(e.estimatedPrice)}.`, 'update');
      redraw();
    });
    if(q('#m-prepare-btn')) q('#m-prepare-btn').addEventListener('click', ()=>{
      merchantAdvance(e, 'PREPARING');
      notifyErrandParties(e, 'Order Update', `${e.sellerName} is preparing your order.`, 'update');
      redraw();
    });
    if(q('#m-ready-btn')) q('#m-ready-btn').addEventListener('click', ()=>{
      merchantAdvance(e, 'READY_FOR_PICKUP');
      notifyErrandParties(e, 'Ready for Pickup', `${e.itemName} is ready for pickup at ${e.sellerName}.`, 'update');
      toast('Customer and agent notified.');
      redraw();
    });
    if(q('#m-sim-arrive')) q('#m-sim-arrive').addEventListener('click', ()=>{
      merchantAdvance(e, 'AGENT_ARRIVED');
      redraw();
    });
    let handoffPhoto = null;
    const drop = q('#m-handoff-drop'), input = q('#m-handoff-input');
    if(drop){
      drop.addEventListener('click', ()=> input.click());
      input.addEventListener('change', ()=>{
        const f = input.files && input.files[0];
        if(!f) return;
        const r = new FileReader();
        r.onload = ()=>{
          handoffPhoto = r.result;
          drop.classList.add('done');
          drop.querySelector('.file-drop-icon').innerHTML = ICON.checkSm;
          drop.querySelector('.file-drop-text').innerHTML = '<strong>Photo added</strong>Handoff proof saved';
        };
        r.readAsDataURL(f);
      });
    }
    if(q('#m-handoff-btn')) q('#m-handoff-btn').addEventListener('click', ()=>{
      e.handoff = { time: new Date().toISOString(), merchantId: currentUser.id, agentId: e.agentId, orderId: e.id, photo: handoffPhoto };
      merchantAdvance(e, 'PICKED_UP', 'Handoff confirmed by merchant');
      e.messages = e.messages || [];
      e.messages.push({ id:'sys_'+Date.now(), sender:'merchant', type:'system', text: e.sellerName + ' handed the item to the agent.', time:new Date().toISOString() });
      saveErrands();
      if(e.buyerId) pushNotificationFor(e.buyerId, 'Errand Update', 'Your item has been picked up.', 'pickup');
      if(e.agentId) pushNotificationFor(e.agentId, 'Item Handed Over', 'The merchant confirmed the handoff. You can start delivery.', 'agent-update');
      toast('Handoff confirmed.');
      redraw();
    });
    const cancelFn = ()=> confirmDialog('Cancel this order?', 'The customer and agent will be notified. This can\'t be undone.', 'Cancel Order', ()=>{
      merchantAdvance(e, 'CANCELLED', 'Cancelled by merchant');
      notifyErrandParties(e, 'Order Cancelled', `${e.sellerName} cancelled the order for ${e.itemName}.`, 'update');
      toast('Order cancelled.');
      redraw();
    });
    if(q('#m-cancel-order')) q('#m-cancel-order').addEventListener('click', cancelFn);
    if(q('#m-cancel-btn')) q('#m-cancel-btn').addEventListener('click', cancelFn);
  }

  /* ---- Products ---- */
  SCREENS['merchant-products'] = function(root){
    const mine = myProducts();
    root.innerHTML = pageHeader('Products') + `
      <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
        <div class="search-bar" style="flex:1;min-width:200px;margin:0;">${ICON.search}<input type="text" id="m-prod-search" placeholder="Search your products..."></div>
        <button class="btn btn-primary" id="m-add-product" style="width:auto;padding:11px 18px;">${ICON.plus} Add Product</button>
      </div>
      <div class="store-grid" id="m-prod-grid"></div>
    `;
    wirePageBack(root);
    const grid = root.querySelector('#m-prod-grid');
    function paint(q){
      const list = mine.filter(p=> !q || p.name.toLowerCase().includes(q.toLowerCase()));
      if(!mine.length){
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">${ICON.bag}</div><p><strong style="color:var(--text);">No products</strong><br>Add your first product to make your store easier to discover.</p><button class="btn btn-primary" id="m-empty-add">Add Product</button></div>`;
        const b = grid.querySelector('#m-empty-add'); if(b) b.addEventListener('click', ()=>{ currentProductId = null; go('merchant-product-edit'); });
        return;
      }
      if(!list.length){ grid.innerHTML = `<p style="font-size:13.5px;color:var(--text-secondary);">No products match your search.</p>`; return; }
      grid.innerHTML = list.map(p=>`
        <div class="store-card">
          ${p.imageUrl ? `<img class="product-thumb" src="${p.imageUrl}" alt="${escAttr(p.name)}">` : `<div class="product-thumb">${ICON.bag}</div>`}
          <div style="flex:1;min-width:0;">
            <div class="seller-row-name">${escHtml(p.name)}</div>
            <div class="seller-row-meta"><span class="price-strong">${fmtNaira(p.price)}</span> · ${escHtml(p.category||'')}</div>
            <div class="seller-row-meta">${p.isAvailable!==false ? '<span class="open-tag">Available</span>' : '<span class="closed-tag">Unavailable</span>'} · Stock: ${p.stockQuantity==null?'—':p.stockQuantity}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <label class="switch" title="Available"><input type="checkbox" data-avail="${p.id}" ${p.isAvailable!==false?'checked':''}><span class="switch-track"></span></label>
            <button class="btn btn-outline" data-edit="${p.id}" style="width:auto;padding:9px 14px;">Edit</button>
          </div>
        </div>
      `).join('');
      grid.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=>{ currentProductId = b.getAttribute('data-edit'); go('merchant-product-edit'); }));
      grid.querySelectorAll('[data-avail]').forEach(cb=> cb.addEventListener('change', ()=>{
        const p = products.find(x=>x.id===cb.getAttribute('data-avail') && x.merchantId===currentUser.id);
        if(!p) return;
        p.isAvailable = cb.checked; p.updatedAt = new Date().toISOString();
        saveProducts();
        toast(cb.checked ? 'Marked available.' : 'Marked unavailable.');
        paint(root.querySelector('#m-prod-search').value);
      }));
    }
    paint('');
    root.querySelector('#m-prod-search').addEventListener('input', (ev)=> paint(ev.target.value));
    root.querySelector('#m-add-product').addEventListener('click', ()=>{ currentProductId = null; go('merchant-product-edit'); });
  };

  SCREENS['merchant-product-edit'] = function(root){
    let p = currentProductId ? products.find(x=>x.id===currentProductId) : null;
    if(currentProductId && (!p || p.merchantId !== currentUser.id)){
      root.innerHTML = pageHeader('Product') + `<div class="empty-state"><p>This product isn't available to your store.</p></div>`;
      wirePageBack(root);
      return;
    }
    const isNew = !p;
    p = p || { name:'', description:'', price:'', category:'Grocery', imageUrl:'', stockQuantity:0, isAvailable:true, sku:'' };
    let imageUrl = p.imageUrl || '';
    root.innerHTML = pageHeader(isNew ? 'Add Product' : 'Edit Product') + `
      <div class="form-card" style="max-width:100%;">
        <div class="field"><label for="pe-name">Product name</label><input id="pe-name" type="text" value="${escAttr(p.name)}" placeholder="e.g. Indomie Instant Noodles"><div class="field-error" id="pe-name-err"></div></div>

          <div class="field"><label for="pe-sku">SKU / reference</label><input id="pe-sku" type="text" value="${escAttr(p.sku||'')}"></div>
        </div>
        <div class="field"><label>Product image</label>
          <div class="file-drop" id="pe-image-drop"><div class="file-drop-icon">${ICON.image}</div><div class="file-drop-text"><strong>${imageUrl?'Change image':'Upload image'}</strong>Optional</div></div>
          <input type="file" id="pe-image-input" accept="image/*" style="display:none;">
          <div id="pe-preview">${imageUrl?`<img src="${imageUrl}" alt="preview" style="max-width:120px;border-radius:12px;margin-top:10px;">`:''}</div>
        </div>
        <div class="system-toggle-row" style="margin-bottom:18px;"><div><strong>Available for orders</strong><span>Customers can request this product.</span></div><label class="switch"><input type="checkbox" id="pe-avail" ${p.isAvailable!==false?'checked':''}><span class="switch-track"></span></label></div>
        <button class="btn btn-primary" id="pe-save">${isNew?'Add Product':'Save Changes'}</button>
        ${isNew ? '' : '<button class="btn btn-outline" id="pe-delete" style="margin-top:12px;">Delete Product</button>'}
      </div>
    `;
    wirePageBack(root);
    const drop = root.querySelector('#pe-image-drop'), input = root.querySelector('#pe-image-input');
    drop.addEventListener('click', ()=> input.click());
    input.addEventListener('change', ()=>{
      const f = input.files && input.files[0];
      if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{ imageUrl = r.result; root.querySelector('#pe-preview').innerHTML = `<img src="${imageUrl}" alt="preview" style="max-width:120px;border-radius:12px;margin-top:10px;">`; };
      r.readAsDataURL(f);
    });
    root.querySelector('#pe-save').addEventListener('click', ()=>{
      const name = root.querySelector('#pe-name').value.trim();
      const priceRaw = root.querySelector('#pe-price').value.trim();
      const price = Number(priceRaw);
      let ok = true;
      const ne = root.querySelector('#pe-name-err'), pe = root.querySelector('#pe-price-err');
      ne.classList.remove('show'); pe.classList.remove('show');
      if(name.length < 2){ ne.textContent = 'Enter a product name'; ne.classList.add('show'); ok = false; }
      if(priceRaw === '' || isNaN(price) || price < 0){ pe.textContent = 'Enter a valid price'; pe.classList.add('show'); ok = false; }
      if(!ok) return;
      const stock = Math.max(0, parseInt(root.querySelector('#pe-stock').value, 10) || 0);
      const data = {
        name, description: root.querySelector('#pe-desc').value.trim(), price,
        category: root.querySelector('#pe-cat').value, imageUrl, stockQuantity: stock,
        isAvailable: root.querySelector('#pe-avail').checked, sku: root.querySelector('#pe-sku').value.trim(),
        updatedAt: new Date().toISOString()
      };
      if(isNew){
        products.push(Object.assign({ id:'pr_'+Date.now(), merchantId: currentUser.id, createdAt: new Date().toISOString() }, data));
      } else {
        Object.assign(p, data);
      }
      saveProducts();
      toast(isNew ? 'Product added.' : 'Product updated.');
      goBack();
    });
    const del = root.querySelector('#pe-delete');
    if(del) del.addEventListener('click', ()=> confirmDialog('Delete this product?', 'It will be removed from your store. This can\'t be undone.', 'Delete', ()=>{
      products = products.filter(x=> x.id !== p.id);
      saveProducts();
      toast('Product deleted.');
      goBack();
    }));
  };

  /* ================= DOCUMENT REVIEW & APPLICATION APPROVAL ================= */
  let appDocs = store.get('ue_app_docs', []);
  const ALLOWED_DOC_TYPES = ['image/jpeg','image/png','image/webp','application/pdf'];
  const MAX_IMAGE_BYTES = 8 * 1024 * 1024;
  const MAX_PDF_BYTES = 1.5 * 1024 * 1024;
  const DOC_ACCEPT = 'image/jpeg,image/png,image/webp,application/pdf';
  const APP_STATUS_LABEL = { PENDING_REVIEW:'Pending Review', UNDER_REVIEW:'Under Review', APPROVED:'Approved', DECLINED:'Declined', RESUBMISSION_REQUIRED:'Resubmission Required' };
  const APP_STATUS_CLASS = { PENDING_REVIEW:'pending', UNDER_REVIEW:'live', APPROVED:'done', DECLINED:'cancelled', RESUBMISSION_REQUIRED:'pending' };
  const DECLINE_PRESETS = ['Invalid identification document','Document does not match applicant information','Required document missing','Application information is inconsistent','Verification failed','Other'];
  const REJECT_PRESETS = ['Document is expired','Document image is unclear. Please upload a clearer copy.','Document does not match applicant information','Wrong document type'];

  function saveAppDocs(){ try{ localStorage.setItem('ue_app_docs', JSON.stringify(appDocs)); return true; }catch(e){ return false; } }
  function persistUser(u){
    const idx = users.findIndex(x=>x.id===u.id);
    if(idx>-1) users[idx] = u; else users.push(u);
    saveUsers();
    if(currentUser && currentUser.id === u.id){ currentUser = u; saveSession(); }
  }
  function requiredDocTypes(u){
    if(u.role === 'agent_rider') return ['Government ID','Selfie','Vehicle Document'];
    if(u.role === 'agent_runner') return ['Government ID','Selfie'];
    if(u.role === 'seller') return ['Government ID','Store Photo'];
    return [];
  }
  function docsFor(userId){ return appDocs.filter(d=>d.applicantId===userId); }
  function docOfType(userId, type){ return appDocs.find(d=>d.applicantId===userId && d.documentType===type); }
  function appStatus(u){
    if(u.applicationStatus) return u.applicationStatus;
    if(u.verificationStatus === 'Verified') return 'APPROVED';
    if(u.verificationStatus === 'Rejected') return 'DECLINED';
    return 'PENDING_REVIEW';
  }
  function appId(u){ return 'APP-' + String(u.id).slice(-6).toUpperCase(); }
  function appStatusChip(u){
    const st = appStatus(u);
    return '<span class="status-chip ' + APP_STATUS_CLASS[st] + '"><span class="dot"></span>' + APP_STATUS_LABEL[st] + '</span>';
  }
  function applicantName(u){ return u.businessName ? (u.businessName + (u.ownerName ? ' (' + u.ownerName + ')' : '')) : (u.fullName || 'Applicant'); }
  function fmtBytes(n){ if(n < 1024) return n + ' B'; if(n < 1048576) return Math.round(n/1024) + ' KB'; return (n/1048576).toFixed(1) + ' MB'; }
  function fileKind(type){ if(type === 'application/pdf') return 'PDF'; return String(type.split('/')[1] || 'FILE').toUpperCase().replace('JPEG','JPG'); }
  function docSlug(t){ return String(t).replace(/[^a-z0-9]+/gi,'-').toLowerCase(); }
  function notifyAdmins(title, message, type){
    users.filter(x=>x.role==='admin').forEach(a=> pushNotificationFor(a.id, title, message, type || 'system'));
  }
  function missingRequiredInfo(u){
    const miss = [];
    if(u.role === 'seller'){
      if(!u.businessName) miss.push('business name');
      if(!u.ownerName) miss.push('owner name');
      if(!u.address) miss.push('business address');
      if(!u.category) miss.push('business category');
    } else {
      if(!u.fullName) miss.push('full name');
      if(u.role === 'agent_rider' && !u.transport) miss.push('transport type');
    }
    if(!u.phone) miss.push('phone');
    if(!u.email) miss.push('email');
    return miss;
  }

  /* ---- file handling ---- */
  function fileToDoc(file, cb){
    if(!file) return cb('No file selected.');
    if(ALLOWED_DOC_TYPES.indexOf(file.type) === -1) return cb('Unsupported file type. Please upload a JPG, PNG or WebP image, or a PDF.');
    const isPdf = file.type === 'application/pdf';
    if(isPdf && file.size > MAX_PDF_BYTES) return cb('This PDF is too large (max ' + fmtBytes(MAX_PDF_BYTES) + '). Upload a smaller PDF, or a photo of the document.');
    if(!isPdf && file.size > MAX_IMAGE_BYTES) return cb('This image is too large (max ' + fmtBytes(MAX_IMAGE_BYTES) + ').');
    const reader = new FileReader();
    reader.onerror = ()=> cb('Could not read this file. Please try again.');
    reader.onload = ()=>{
      const base = { fileName:file.name, fileType:file.type, fileSize:file.size, dataUrl:reader.result };
      if(isPdf) return cb(null, base);
      shrinkImage(reader.result, (small)=>{ if(small) base.dataUrl = small; cb(null, base); });
    };
    reader.readAsDataURL(file);
  }
  function shrinkImage(dataUrl, done){
    let finished = false;
    const finish = (v)=>{ if(finished) return; finished = true; done(v); };
    setTimeout(()=> finish(null), 4000);
    try{
      const img = new Image();
      img.onload = ()=>{
        try{
          const w = img.width, h = img.height;
          if(!w || !h) return finish(null);
          const scale = Math.min(1, 1400 / Math.max(w, h));
          const c = document.createElement('canvas');
          c.width = Math.round(w * scale); c.height = Math.round(h * scale);
          const ctx = c.getContext('2d');
          if(!ctx) return finish(null);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          finish(c.toDataURL('image/jpeg', 0.82));
        }catch(e){ finish(null); }
      };
      img.onerror = ()=> finish(null);
      img.src = dataUrl;
    }catch(e){ finish(null); }
  }
  function upsertDoc(userId, role, type, data){
    const now = new Date().toISOString();
    const existing = docOfType(userId, type);
    if(existing){
      Object.assign(existing, { fileName:data.fileName, fileType:data.fileType, fileSize:data.fileSize, dataUrl:data.dataUrl, status:'NOT_REVIEWED', rejectionReason:'', uploadedAt:now, reviewedAt:null, reviewedBy:null, viewedAt:null, viewedBy:null, resubmissions:(existing.resubmissions||0)+1 });
      return existing;
    }
    const d = { id:'doc_'+Date.now()+Math.random().toString(16).slice(2,6), applicantId:userId, role, documentType:type, fileName:data.fileName, fileType:data.fileType, fileSize:data.fileSize, dataUrl:data.dataUrl, status:'NOT_REVIEWED', rejectionReason:'', uploadedAt:now, reviewedAt:null, reviewedBy:null, viewedAt:null, viewedBy:null, resubmissions:0 };
    appDocs.push(d);
    return d;
  }
  function submitApplication(user, holder){
    const snap = appDocs.map(d=>Object.assign({}, d));
    Object.keys(holder).forEach(t=> upsertDoc(user.id, user.role, t, holder[t]));
    if(!saveAppDocs()){ appDocs = snap; return false; }
    user.applicationStatus = 'PENDING_REVIEW';
    user.applicationSubmittedAt = new Date().toISOString();
    return true;
  }

  /* ---- document viewer ---- */
  function dataUrlToBlob(dataUrl){
    const parts = dataUrl.split(',');
    const mime = (parts[0].match(/:(.*?);/) || [])[1] || 'application/octet-stream';
    const bin = atob(parts[1]);
    const arr = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }
  function downloadDoc(doc){
    try{
      const url = URL.createObjectURL(dataUrlToBlob(doc.dataUrl));
      const a = document.createElement('a');
      a.href = url; a.download = doc.fileName || (doc.documentType + '.' + fileKind(doc.fileType).toLowerCase());
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 4000);
    }catch(e){ toast('Download is not available here. Open the app outside the preview to download files.'); }
  }
  function closeDocViewer(){
    const el = document.getElementById('doc-viewer');
    if(el){
      if(el._blobUrl){ try{ URL.revokeObjectURL(el._blobUrl); }catch(e){} }
      if(el._onKey) document.removeEventListener('keydown', el._onKey);
      el.remove();
    }
  }
  function openDocViewer(doc, opts){
    opts = opts || {};
    closeDocViewer();
    const isImg = doc.fileType.indexOf('image/') === 0;
    const isPdf = doc.fileType === 'application/pdf';
    const el = document.createElement('div');
    el.className = 'doc-viewer'; el.id = 'doc-viewer';
    el.innerHTML = '<div class="doc-viewer-bar"><span class="dv-title">' + escHtml(doc.documentType) + ' — ' + escHtml(doc.fileName) + '</span>' +
      (isImg ? '<button data-z="out">−</button><button data-z="in">+</button><button data-z="reset">Reset</button>' : '') +
      '<button data-dl>Download</button><button data-close>Close</button></div><div class="doc-viewer-body" id="dv-body"></div>';
    document.body.appendChild(el);
    const body = el.querySelector('#dv-body');
    if(isImg){
      let z = 1;
      const base = Math.min((window.innerWidth || 800) - 32, 900);
      const img = document.createElement('img');
      img.id = 'dv-image'; img.src = doc.dataUrl; img.alt = doc.documentType;
      const apply = ()=>{ img.style.width = Math.round(base * z) + 'px'; };
      apply();
      body.appendChild(img);
      el.querySelector('[data-z="in"]').onclick = ()=>{ z = Math.min(4, z + 0.25); apply(); };
      el.querySelector('[data-z="out"]').onclick = ()=>{ z = Math.max(0.5, z - 0.25); apply(); };
      el.querySelector('[data-z="reset"]').onclick = ()=>{ z = 1; apply(); };
    } else if(isPdf){
      try{
        el._blobUrl = URL.createObjectURL(dataUrlToBlob(doc.dataUrl));
        const frame = document.createElement('iframe');
        frame.id = 'dv-pdf'; frame.src = el._blobUrl; frame.title = doc.fileName;
        body.appendChild(frame);
      }catch(e){
        body.innerHTML = '<p style="color:#fff;">This browser could not display the PDF inline. Use Download to open it.</p>';
      }
    } else {
      body.innerHTML = '<p style="color:#fff;">' + escHtml(doc.fileName) + ' (' + escHtml(doc.fileType) + ') cannot be previewed. Use Download.</p>';
    }
    if(isPdf){ const note = document.createElement('p'); note.className = 'doc-sub'; note.style.cssText = 'color:#fff;text-align:center;padding:0 16px 12px;'; note.textContent = 'If the PDF does not display in this preview, use Download and open the file on your device.'; el.appendChild(note); }
    el._onKey = (ev)=>{ if(ev.key === 'Escape') closeDocViewer(); };
    document.addEventListener('keydown', el._onKey);
    el.querySelector('[data-dl]').onclick = ()=> downloadDoc(doc);
    el.querySelector('[data-close]').onclick = closeDocViewer;
    if(opts.admin && isAdminUser(currentUser)){
      const first = !doc.viewedAt;
      doc.viewedAt = new Date().toISOString(); doc.viewedBy = currentUser.id;
      saveAppDocs();
      if(first && opts.onViewed) opts.onViewed();
    }
  }

  function reviewSummary(u){
    const req = requiredDocTypes(u);
    const get = t=> docOfType(u.id, t);
    const missing = req.filter(t=> !get(t));
    const submitted = req.filter(t=> !!get(t));
    const reviewed = submitted.filter(t=> get(t).status !== 'NOT_REVIEWED');
    const verified = submitted.filter(t=> get(t).status === 'VERIFIED');
    const rejected = submitted.filter(t=> get(t).status === 'REJECTED');
    const unreviewed = submitted.length - reviewed.length;
    const infoMissing = missingRequiredInfo(u);
    const blockers = [];
    if(infoMissing.length) blockers.push('Required applicant information is incomplete (' + infoMissing.join(', ') + ').');
    if(missing.length) blockers.push(missing.length + ' required document' + (missing.length > 1 ? 's have' : ' has') + ' not been submitted (' + missing.join(', ') + ').');
    if(unreviewed > 0) blockers.push(unreviewed + ' required document' + (unreviewed > 1 ? 's have' : ' has') + ' not been reviewed.');
    if(rejected.length) blockers.push(rejected.length + ' required document' + (rejected.length > 1 ? 's are' : ' is') + ' marked rejected.');
    return { req, missing, submitted, reviewed, verified, rejected, blockers, canApprove: blockers.length === 0 };
  }
  function auditApplication(action, u, prevStatus, newStatus, reason, extra){
    logAudit(action, 'application', u.id, reason || '', Object.assign({ status: prevStatus, applicantId: u.id, applicationId: appId(u) }, extra || {}), Object.assign({ status: newStatus, applicantId: u.id, applicationId: appId(u) }, extra || {}));
  }
  function setApplicationStatus(u, next, reason){
    const prev = appStatus(u);
    u.applicationStatus = next;
    persistUser(u);
    return prev;
  }
  function markApplicationOpened(u){
    if(!isAdminUser(currentUser)) return;

      const prev = setApplicationStatus(u, 'UNDER_REVIEW');

    }
  }

      if(!resubTargets) html += '<p class="doc-sub">Reject a document (with a reason) to enable Request Resubmission.</p>';

  function wireApplicationReview(root, u, rerender){
    root.querySelectorAll('[data-doc-view]').forEach(b=> b.addEventListener('click', ()=>{
      const doc = appDocs.find(d=>d.id === b.getAttribute('data-doc-view'));
      if(!doc) return;
      openDocViewer(doc, { admin: !['APPROVED','DECLINED'].includes(appStatus(u)), onViewed: ()=>{
        const card = root.querySelector('[data-doc="' + doc.id + '"]');
        if(!card) return;
        const v = card.querySelector('[data-doc-verify]'), r = card.querySelector('[data-doc-reject]');
        if(v && doc.status !== 'VERIFIED') v.disabled = false;
        if(r && doc.status !== 'REJECTED') r.disabled = false;
        const hint = card.querySelector('.doc-hint'); if(hint) hint.remove();
      }});
    }));
    root.querySelectorAll('[data-doc-download]').forEach(b=> b.addEventListener('click', ()=>{
      const doc = appDocs.find(d=>d.id === b.getAttribute('data-doc-download'));
      if(doc) downloadDoc(doc);
    }));
    root.querySelectorAll('[data-doc-verify]').forEach(b=> b.addEventListener('click', ()=>{
      if(!isAdminUser(currentUser)) return toast('Only admins can review documents.');
      const doc = appDocs.find(d=>d.id === b.getAttribute('data-doc-verify'));
      if(!doc) return;
      if(!doc.viewedAt) return toast('Open the document before verifying it.');
      const prev = doc.status;
      doc.status = 'VERIFIED'; doc.rejectionReason = ''; doc.reviewedAt = new Date().toISOString(); doc.reviewedBy = currentUser.id;
      if(!saveAppDocs()){ doc.status = prev; return toast('Could not save this decision. Storage may be full.'); }
      logAudit('DOCUMENT_VERIFIED', 'document', doc.id, '', { status: prev, applicantId: u.id, applicationId: appId(u), documentType: doc.documentType }, { status: 'VERIFIED', applicantId: u.id, applicationId: appId(u), documentType: doc.documentType });
      toast(doc.documentType + ' verified.');
      rerender();
    }));
    root.querySelectorAll('[data-doc-reject]').forEach(b=> b.addEventListener('click', ()=>{
      if(!isAdminUser(currentUser)) return toast('Only admins can review documents.');
      const doc = appDocs.find(d=>d.id === b.getAttribute('data-doc-reject'));
      if(!doc) return;
      if(!doc.viewedAt) return toast('Open the document before rejecting it.');
      reasonDialog('Reject ' + doc.documentType + '?', 'Explain what is wrong so the applicant can fix it.', 'Reject Document', (reason)=>{
        const prev = doc.status;
        doc.status = 'REJECTED'; doc.rejectionReason = reason; doc.reviewedAt = new Date().toISOString(); doc.reviewedBy = currentUser.id;
        if(!saveAppDocs()){ doc.status = prev; return toast('Could not save this decision. Storage may be full.'); }
        logAudit('DOCUMENT_REJECTED', 'document', doc.id, reason, { status: prev, applicantId: u.id, applicationId: appId(u), documentType: doc.documentType }, { status: 'REJECTED', applicantId: u.id, applicationId: appId(u), documentType: doc.documentType });
        toast(doc.documentType + ' rejected.');
        rerender();
      }, REJECT_PRESETS);
    }));
    const approve = root.querySelector('#app-approve');
    if(approve) approve.addEventListener('click', ()=>{
      if(!isAdminUser(currentUser)) return toast('Only admins can approve applications.');
      const sum = reviewSummary(u);
      if(!sum.canApprove) return toast('Application cannot be approved yet.');
      confirmDialog('Approve Application?', 'You are about to approve this applicant. Make sure all required documents and information have been verified.', 'Confirm Approval', ()=>{
        const again = reviewSummary(u);
        if(!again.canApprove) return toast('Application cannot be approved yet.');
        const prev = appStatus(u);
        u.applicationStatus = 'APPROVED'; u.verificationStatus = 'Verified'; u.status = 'active';
        u.reviewedBy = currentUser.id; u.reviewedAt = new Date().toISOString(); u.decisionReason = '';
        persistUser(u);
        auditApplication('APPLICATION_APPROVED', u, prev, 'APPROVED', '');
        pushNotificationFor(u.id, 'Application Approved', 'Your Urban Errand application has been approved. Welcome to Urban Errand.', 'system');
        toast('Application approved.');
        rerender();
      });
    });
    const decline = root.querySelector('#app-decline');
    if(decline) decline.addEventListener('click', ()=>{
      if(!isAdminUser(currentUser)) return toast('Only admins can decline applications.');
      reasonDialog('Decline Application?', 'The applicant will be notified with the reason you give.', 'Decline Application', (reason)=>{
        const prev = appStatus(u);
        u.applicationStatus = 'DECLINED'; u.verificationStatus = 'Rejected';
        u.reviewedBy = currentUser.id; u.reviewedAt = new Date().toISOString(); u.decisionReason = reason;
        persistUser(u);
        auditApplication('APPLICATION_DECLINED', u, prev, 'DECLINED', reason);
        pushNotificationFor(u.id, 'Application Declined', 'Your Urban Errand application was declined. Please review the reason provided: ' + reason, 'system');
        toast('Application declined.');
        rerender();
      }, DECLINE_PRESETS);
    });
    const resub = root.querySelector('#app-resubmit');
    if(resub) resub.addEventListener('click', ()=>{
      if(!isAdminUser(currentUser)) return toast('Only admins can request resubmission.');
      const rejectedDocs = docsFor(u.id).filter(d=>d.status === 'REJECTED');
      const missing = requiredDocTypes(u).filter(t=> !docOfType(u.id, t));
      if(!rejectedDocs.length && !missing.length) return toast('Reject a document or wait for a missing document first.');
      const lines = rejectedDocs.map(d=> d.documentType + ': ' + d.rejectionReason).concat(missing.map(t=> t + ': required document not submitted'));
      confirmDialog('Request resubmission?', 'The applicant will be asked to fix: ' + lines.map(escHtml).join(' • '), 'Send Request', ()=>{
        const prev = appStatus(u);
        u.applicationStatus = 'RESUBMISSION_REQUIRED';
        u.reviewedBy = currentUser.id; u.reviewedAt = new Date().toISOString();
        persistUser(u);
        auditApplication('RESUBMISSION_REQUESTED', u, prev, 'RESUBMISSION_REQUIRED', lines.join(' | '));
        pushNotificationFor(u.id, 'Resubmission Required', 'Additional verification is required. Please review the requested changes and resubmit your document. ' + lines.join('; '), 'action-required');
        toast('Resubmission requested.');
        rerender();
      });
    });
  }

  /* ---- applicant side ---- */

        (d.status === 'REJECTED' && d.rejectionReason ? '<p class="doc-reason"><b>Why it was rejected:</b> ' + escHtml(d.rejectionReason) + '</p>' : '') +

  function wireApplicantPanel(root, u, rerender){
    root.querySelectorAll('[data-own-view]').forEach(b=> b.addEventListener('click', ()=>{
      const doc = appDocs.find(d=> d.id === b.getAttribute('data-own-view') && d.applicantId === u.id);
      if(doc) openDocViewer(doc, { admin:false });
    }));
    root.querySelectorAll('[data-up]').forEach(drop=>{
      const id = drop.getAttribute('data-up'), type = drop.getAttribute('data-up-type');
      const input = root.querySelector('[data-up-input="' + id + '"]');
      const err = root.querySelector('[data-up-err="' + id + '"]');
      drop.addEventListener('click', ()=> input.click());
      input.addEventListener('change', ()=>{
        const file = input.files && input.files[0];
        if(!file) return;
        err.classList.remove('show');
        fileToDoc(file, (e, data)=>{
          if(e){ err.textContent = e; err.classList.add('show'); return; }
          const snap = appDocs.map(d=>Object.assign({}, d));
          upsertDoc(u.id, u.role, type, data);
          if(!saveAppDocs()){ appDocs = snap; err.textContent = 'Browser storage is full (about 5 MB in total for this prototype). Try a smaller file.'; err.classList.add('show'); return; }
          const rejectedLeft = docsFor(u.id).filter(d=>d.status === 'REJECTED').length;
          const missingLeft = requiredDocTypes(u).filter(t=> !docOfType(u.id, t)).length;
          if(appStatus(u) === 'RESUBMISSION_REQUIRED' && rejectedLeft === 0 && missingLeft === 0){
            const prev = appStatus(u);
            u.applicationStatus = 'PENDING_REVIEW'; u.applicationSubmittedAt = new Date().toISOString();
            persistUser(u);
            auditApplication('RESUBMISSION_SUBMITTED', u, prev, 'PENDING_REVIEW', 'Applicant uploaded replacement document(s)');
            notifyAdmins('Application Resubmitted', applicantName(u) + ' uploaded replacement documents for review.', 'system');
          } else if(appStatus(u) !== 'RESUBMISSION_REQUIRED'){
            notifyAdmins('New Document Submitted', applicantName(u) + ' uploaded ' + type + '.', 'system');
          }
          toast('Document uploaded.');
          rerender();
        });
      });
    });
  }

      else if(creds && creds[c.key] && creds[c.key].declared === 'yes') state = 'PENDING_REVIEW';

  function fmtDT(iso){ return iso ? new Date(iso).toLocaleString() : '—'; }
  function periodPredicate(period){
    const now = Date.now();
    return (iso)=>{
      if(period==='all') return true;
      const t = new Date(iso).getTime();
      if(period==='today') return isToday(iso);
      if(period==='7d') return now - t < 7*86400000;
      if(period==='30d') return now - t < 30*86400000;
      return true;
    };
  }
  function allBuyerUsers(){ return users.filter(u=>u.role==='buyer'); }
  function allAgentAccounts(){ return users.filter(u=>isAgentUser(u)); }
  function allMerchantAccounts(){ return users.filter(u=>isMerchantUser(u)); }
  function suspendAccount(u, reason){
    const before = { suspended: !!u.suspended };
    u.suspended = true;
    if(isAgentUser(u)) u.online = false;
    if(isMerchantUser(u)) u.isOpen = false;
    const idx = users.findIndex(x=>x.id===u.id); if(idx>-1) users[idx]=u; saveUsers();
    logAudit('SUSPEND_ACCOUNT', u.role, u.id, reason, before, { suspended:true });
    pushNotificationFor(u.id, 'Account Suspended', 'Your Urban Errand account has been suspended. Contact support for details.', 'system');
  }
  function reactivateAccount(u, reason){
    const before = { suspended: !!u.suspended };
    u.suspended = false;
    const idx = users.findIndex(x=>x.id===u.id); if(idx>-1) users[idx]=u; saveUsers();
    logAudit('REACTIVATE_ACCOUNT', u.role, u.id, reason, before, { suspended:false });
    pushNotificationFor(u.id, 'Account Reactivated', 'Your Urban Errand account has been reactivated.', 'system');
  }
  function setVerification(u, status, reason){
    const before = { verificationStatus: u.verificationStatus };
    u.verificationStatus = status;
    if(status==='Verified') u.status = 'active';
    const idx = users.findIndex(x=>x.id===u.id); if(idx>-1) users[idx]=u; saveUsers();
    logAudit('VERIFICATION_DECISION', u.role, u.id, reason, before, { verificationStatus: status });
    pushNotificationFor(u.id, status==='Verified' ? 'Verification Approved' : 'Verification Rejected', status==='Verified' ? 'Your account has been verified.' : ('Your verification was rejected.' + (reason?' Reason: '+reason:'')), 'system');
  }
  function ensureDisputeRecords(){
    const flagged = errands.filter(e=> e.status==='ITEM_UNAVAILABLE' || e.status==='CANCELLED' || e.status==='AGENT_CANCELLED' || e.status==='CUSTOMER_UNAVAILABLE' || e.status==='DISPUTED' || (e.priceChange && e.priceChange.status==='rejected'));
    flagged.forEach(e=>{
      if(disputes.some(d=>d.errandId===e.id)) return;
      let category = 'Cancelled Errand';
      if(e.status==='ITEM_UNAVAILABLE') category = 'Item Unavailable';
      else if(e.status==='DISPUTED') category = 'Payment Dispute';
      else if(e.priceChange && e.priceChange.status==='rejected') category = 'Price Dispute';
      disputes.push({
        id:'dsp_'+e.id, errandId: e.id, reportingAccount: e.buyerName || 'Customer',
        category, description: STATUS_META[e.status] || category,
        assignedAdmin:'', status:'Open', resolution:'',
        createdAt: e.createdAt, updatedAt: new Date().toISOString()
      });
    });
    if(flagged.length) saveDisputes();
  }

    const dupRefs = {};
    withRef.forEach(c=>{ dupRefs[c.paymentReference] = (dupRefs[c.paymentReference]||0)+1; });
    root.querySelector('#ap-list').innerHTML = withRef.map(c=>{
      const agent = findAgent(c.agentId);
      const isDup = dupRefs[c.paymentReference] > 1;
      return `<div class="order-card"><div class="order-card-top"><span class="order-card-item">${agent?escHtml(agent.name):'Agent'} — ${c.id.slice(-6).toUpperCase()}</span><span class="status-chip ${c.status==='PAID'?'done':'pending'}"><span class="dot"></span>${c.status.replace(/_/g,' ')}</span></div>
      <div class="order-card-meta">Expected ${fmtNaira(c.commissionAmount)} · Reference: ${c.paymentReference}${isDup?' <span style="color:var(--danger);font-weight:700;">⚠ Duplicate reference</span>':''}<br>Transaction: ${c.paymentTransactionId||'—'} · ${c.paidAt?'Verified '+fmtDT(c.paidAt):'Not yet verified'}</div></div>`;
    }).join('');
  };

  /* ---- Analytics ---- */
  SCREENS['admin-analytics'] = function(root){
    const completed = errands.filter(e=>e.status==='COMPLETED');
    const cancelled = errands.filter(e=> ['CANCELLED','AGENT_CANCELLED','CUSTOMER_UNAVAILABLE'].includes(e.status));
    const avgFee = completed.length ? Math.round(completed.reduce((s,e)=>s+(Number(e.agentFee)||0),0)/completed.length) : 0;
    const genCommission = commissions.reduce((s,c)=>s+c.commissionAmount,0);
    const collected = commissions.filter(c=>c.status==='PAID').reduce((s,c)=>s+c.commissionAmount,0);
    const catCount = {};
    errands.forEach(e=>{
      const p = products.find(pr=> e.itemName.toLowerCase().includes(pr.name.toLowerCase()));
      const c = p ? p.category : 'Other'; catCount[c] = (catCount[c]||0)+1;
    });
    function bars(obj){
      const arr = Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,6);
      if(!arr.length) return `<p style="font-size:13px;color:var(--text-secondary);margin:0;">No data yet.</p>`;
      const max = arr[0][1];
      return arr.map(([l,v])=>`<div class="bar-row"><span class="bar-label">${escHtml(l)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/max*100)}%"></div></div><span class="bar-val">${v}</span></div>`).join('');
    }
    root.innerHTML = pageHeader('Analytics') + (errands.length ? `
      <div class="summary-grid" style="margin-bottom:20px;">
        <div class="stat-box"><b>${errands.length}</b><span>Total errands</span></div>
        <div class="stat-box"><b>${completed.length}</b><span>Completed</span></div>
        <div class="stat-box"><b>${cancelled.length}</b><span>Cancelled</span></div>
        <div class="stat-box"><b>${fmtNaira(avgFee)}</b><span>Average agent fee</span></div>
        <div class="stat-box"><b>${fmtNaira(genCommission)}</b><span>Commission generated</span></div>
        <div class="stat-box"><b>${fmtNaira(collected)}</b><span>Commission collected</span></div>
      </div>
      <div class="section-heading"><h2>Popular product categories</h2></div>
      <div class="active-errand-card">${bars(catCount)}</div>
      <div class="section-heading"><h2>User registrations</h2></div>
      <div class="active-errand-card"><div class="review-row"><span class="r-label">Total Users</span><span class="r-value">${allBuyerUsers().length}</span></div><div class="review-row"><span class="r-label">Total Agents</span><span class="r-value">${allAgentAccounts().length}</span></div><div class="review-row"><span class="r-label">Total Merchants</span><span class="r-value">${allMerchantAccounts().length}</span></div></div>
    ` : `<div class="empty-state"><div class="empty-icon">${ICON.wallet}</div><p>Analytics will appear once the platform has activity.</p></div>`);
    wirePageBack(root);
  };

  /* ---- Disputes & Support ---- */
  SCREENS['admin-support'] = function(root){
    ensureDisputeRecords();
    root.innerHTML = pageHeader('Disputes & Support') + `
      <div class="tab-row" id="as-tabs">${[['all','All'],['Open','Open'],['Under Review','Under Review'],['Awaiting Response','Awaiting Response'],['Resolved','Resolved'],['Closed','Closed']].map((f,i)=>`<button class="tab-btn${i===0?' active':''}" data-f="${f[0]}">${f[1]}</button>`).join('')}</div>
      <div id="as-list"></div>
    `;
    wirePageBack(root);
    const list = root.querySelector('#as-list');
    let f = 'all';
    function paint(){
      const rows = (f==='all'?disputes:disputes.filter(d=>d.status===f)).slice().sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
      if(!rows.length){ list.innerHTML = `<div class="empty-state"><p>No disputes in this view.</p></div>`; return; }
      list.innerHTML = rows.map(d=>`<div class="order-card"><div class="order-card-top"><span class="order-card-item">${escHtml(d.category)}</span><span class="status-chip ${d.status==='Resolved'||d.status==='Closed'?'done':'pending'}"><span class="dot"></span>${d.status}</span></div>
      <div class="order-card-meta">${escHtml(d.reportingAccount)} · Errand ${shortId({id:d.errandId})}<br>${escHtml(d.description)}</div>
      <div class="order-card-bottom"><span style="font-size:12px;color:var(--text-secondary);">${timeAgo(d.createdAt)}</span><button class="btn btn-outline" data-open="${d.id}">Review</button></div></div>`).join('');
      list.querySelectorAll('[data-open]').forEach(b=> b.addEventListener('click', ()=>{ currentDisputeId = b.getAttribute('data-open'); go('admin-dispute-detail'); }));
    }
    paint();
    root.querySelectorAll('#as-tabs [data-f]').forEach(b=> b.addEventListener('click', ()=>{ root.querySelectorAll('#as-tabs [data-f]').forEach(x=>x.classList.remove('active')); b.classList.add('active'); f=b.getAttribute('data-f'); paint(); }));
  };

  SCREENS['admin-dispute-detail'] = function(root){
    const d = disputes.find(x=>x.id===currentDisputeId);
    if(!d){ root.innerHTML = pageHeader('Dispute'); wirePageBack(root); return; }
    const e = errands.find(x=>x.id===d.errandId);
    root.innerHTML = pageHeader('Dispute') + `
      <div class="review-block">
        <div class="review-row"><span class="r-label">Category</span><span class="r-value">${escHtml(d.category)}</span></div>
        <div class="review-row"><span class="r-label">Reporting account</span><span class="r-value">${escHtml(d.reportingAccount)}</span></div>
        <div class="review-row"><span class="r-label">Related errand</span><span class="r-value">${e?escHtml(e.itemName)+' · '+shortId(e):d.errandId}</span></div>
        <div class="review-row"><span class="r-label">Description</span><span class="r-value">${escHtml(d.description)}</span></div>
        <div class="review-row"><span class="r-label">Reported</span><span class="r-value">${fmtDT(d.createdAt)}</span></div>
      </div>
      <div class="field"><label for="ad-status">Status</label><select id="ad-status">${['Open','Under Review','Awaiting Response','Resolved','Closed'].map(s=>`<option${s===d.status?' selected':''}>${s}</option>`).join('')}</select></div>
      <div class="field"><label for="ad-resolution">Resolution notes</label><textarea id="ad-resolution" rows="3" placeholder="What was decided / done">${escHtml(d.resolution||'')}</textarea></div>
      <button class="btn btn-primary" id="ad-save">Save</button>
      ${e ? `<button class="btn btn-outline" id="ad-open-errand" style="margin-top:12px;">Open Related Errand</button>` : ''}
    `;
    wirePageBack(root);
    root.querySelector('#ad-save').addEventListener('click', ()=>{
      const before = { status: d.status, resolution: d.resolution };
      d.status = root.querySelector('#ad-status').value;
      d.resolution = root.querySelector('#ad-resolution').value.trim();
      d.assignedAdmin = currentUser.fullName || 'Admin';
      d.updatedAt = new Date().toISOString();
      saveDisputes();
      logAudit('DISPUTE_RESOLUTION', 'dispute', d.id, d.resolution, before, { status:d.status, resolution:d.resolution });
      toast('Dispute updated.');
      goBack();
    });
    const oe = root.querySelector('#ad-open-errand');
    if(oe) oe.addEventListener('click', ()=>{ currentOrderId = e.id; go('admin-errand-detail'); });
  };

  /* ---- Audit Log ---- */
  SCREENS['admin-audit-log'] = function(root){
    root.innerHTML = pageHeader('Audit Log') + (auditLog.length ? `<div id="al-list"></div>` : `<div class="empty-state"><div class="empty-icon">${ICON.doc}</div><p>No administrative actions recorded yet.</p></div>`);
    wirePageBack(root);
    if(!auditLog.length) return;
    const safeParse = (t)=>{ try{ return t ? JSON.parse(t) : {}; }catch(e){ return {}; } };
    root.querySelector('#al-list').innerHTML = auditLog.map(a=>{
      const b = safeParse(a.before), f = safeParse(a.after);
      const bs = b.status || b.applicationStatus || b.verificationStatus, ns = f.status || f.applicationStatus || f.verificationStatus;
      const change = (bs && ns && bs !== ns) ? '<br>Status: ' + escHtml(String(bs)) + ' → ' + escHtml(String(ns)) : '';
      const appLine = f.applicationId ? '<br>Application: ' + escHtml(f.applicationId) + ' · Applicant: ' + escHtml(String(f.applicantId).slice(-8)) + (f.documentType ? ' · ' + escHtml(f.documentType) : '') : '';
      return `
      <div class="order-card"><div class="order-card-top"><span class="order-card-item">${escHtml(a.action.replace(/_/g,' '))}</span><span style="font-size:11px;color:var(--text-secondary);">${fmtDT(a.createdAt)}</span></div>
      <div class="order-card-meta">By ${escHtml(a.adminName)}${a.actorRole?' ('+escHtml(a.actorRole)+')':''} · ${escHtml(a.entityType)} ${escHtml(String(a.entityId).slice(-8))}${change}${appLine}${a.reason?'<br>Reason: '+escHtml(a.reason):''}</div></div>`;
    }).join('');
  };

  /* ---- Admin Account ---- */
  SCREENS['admin-account'] = function(root){
    const u = currentUser;
    root.innerHTML = `
      <div class="profile-hero"><div class="avatar">${initials(u.fullName||'Admin')}</div><div><div class="profile-hero-name">${escHtml(u.fullName||'Admin')}</div><div class="profile-hero-meta">${escHtml(u.email||'')}</div></div></div>
      <p style="font-size:12px;color:var(--text-secondary);margin:-10px 0 18px;">This is a fixed internal Admin account for this prototype — there is no public Admin registration.</p>
      <div class="settings-list">
        <button class="settings-item" data-nav="edit-profile"><span class="si-icon">${ICON.edit}</span><span class="si-text">Edit Profile</span><span class="si-arrow">${ICON.arrowR}</span></button>
        <button class="settings-item" data-nav="appearance"><span class="si-icon">${ICON.moon}</span><span class="si-text">Appearance</span><span class="si-arrow">${ICON.arrowR}</span></button>
        <button class="settings-item" data-nav="security"><span class="si-icon">${ICON.shield}</span><span class="si-text">Security</span><span class="si-arrow">${ICON.arrowR}</span></button>
        <button class="settings-item" data-nav="admin-audit-log"><span class="si-icon">${ICON.doc}</span><span class="si-text">Audit Log</span><span class="si-arrow">${ICON.arrowR}</span></button>
        <button class="settings-item" data-nav="help-support"><span class="si-icon">${ICON.help}</span><span class="si-text">Help &amp; Support</span><span class="si-arrow">${ICON.arrowR}</span></button>
        <button class="settings-item danger" id="adacc-logout"><span class="si-icon">${ICON.logout}</span><span class="si-text">Log Out</span></button>
      </div>
    `;
    root.querySelectorAll('[data-nav]').forEach(b=> b.addEventListener('click', ()=> go(b.getAttribute('data-nav'))));
    root.querySelector('#adacc-logout').addEventListener('click', ()=>{ currentUser = null; saveSession(); history = []; go('welcome', {replace:true}); toast("You've been logged out."); });
  };


  /* ---------------- Boot ---------------- */
  // Seed a fixed internal Admin account. There is no public Admin sign-up screen —
  // this is a demo credential so this prototype's Admin dashboard is reachable.
  (function seedAdmin(){
    if(!users.some(u=>u.role==='admin')){
      users.push({
        id:'admin_1', role:'admin', fullName:'Urban Errand Admin',
        email:'admin@urbanerrand.demo', phone:'0800-000-0000',
        password:'admin123', status:'active', createdAt:new Date().toISOString()
      });
      saveUsers();
    }
  })();

  if(currentUser){
    const freshUser = users.find(x=>x.id===currentUser.id);
    if(freshUser) currentUser = freshUser;
  }
  if(currentUser){
    if(currentUser.role === 'buyer'){
      seedDemoDataForBuyer(currentUser);
      render('buyer-dashboard');
    } else if(isAgentUser(currentUser)){
      seedDemoDataForAgent(currentUser);
      render('agent-dashboard');
    } else if(isMerchantUser(currentUser)){
      seedDemoDataForMerchant(currentUser);
      render('merchant-dashboard');
    } else if(isAdminUser(currentUser)){
      render('admin-dashboard');
    } else {
      render('dashboard');
    }
  } else {
    render('welcome');
  }
})();
</script>
</body>
</html>
