<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Urban Errand — Consider It Done.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --denim: #12304A;
    --denim-700: #0D2438;
    --denim-100: #E7EDF2;
    --green: #28A86B;
    --green-600: #1F8A57;
    --green-100: #E4F5EC;
    --white: #FFFFFF;
    --surface: #FFFFFF;
    --bg: #F5F8FA;
    --amber: #C98A1E;
    --amber-bg: #FDF3E7;
    --amber-border: #F3DDAF;
    --text: #12304A;
    --text-secondary: #667085;
    --text-muted: #98A2B3;
    --border: #E4E7EC;
    --danger: #C4432B;

    --font-display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Inter', 'Segoe UI', system-ui, sans-serif;

    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 22px;
    --shadow-card: 0 1px 2px rgba(18,48,74,0.04), 0 8px 24px rgba(18,48,74,0.06);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }
  html, body { height: 100%; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; }
  input, select { font-family: inherit; }

  /* ---------- Shell ---------- */
  #app-shell {
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px clamp(20px, 5vw, 56px);
    padding-top: calc(18px + env(safe-area-inset-top, 0px));
    flex-shrink: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    background: none;
    border: none;
    padding: 0;
  }
  .brand-word {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 19px;
    color: var(--denim);
    letter-spacing: -0.01em;
  }
  .brand-tagline-inline {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 500;
    padding-left: 10px;
    border-left: 1px solid var(--border);
    margin-left: 2px;
    display: none;
  }
  @media (min-width: 640px) { .brand-tagline-inline { display: inline; } }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 600;
    padding: 8px 10px;
    margin-left: -10px;
    border-radius: var(--radius-sm);
  }
  .back-btn:hover { background: var(--denim-100); color: var(--denim); }

  main#view {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .screen {
    animation: screenIn 260ms ease both;
  }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-weight: 600;
    font-size: 15px;
    border-radius: var(--radius-sm);
    padding: 14px 22px;
    border: 1px solid transparent;
    transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
    width: 100%;
  }
  .btn:active { transform: scale(0.985); }
  .btn-primary { background: var(--green); color: var(--white); }
  .btn-primary:hover { background: var(--green-600); }
  .btn-primary:disabled { background: #A7D9C1; cursor: not-allowed; }
  .btn-outline { background: var(--white); color: var(--denim); border-color: var(--border); }
  .btn-outline:hover { border-color: var(--green); color: var(--green-600); }
  .btn-ghost { background: transparent; color: var(--denim); border: none; padding: 10px; }
  .btn-ghost:hover { text-decoration: underline; }
  .btn-google {
    background: var(--white); color: var(--text); border-color: var(--border);
  }
  .btn-google:hover { background: var(--bg); }
  .btn-wide { max-width: 420px; }

  /* ---------- Layout helpers ---------- */
  .center-col {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px clamp(20px, 6vw, 56px) 56px;
  }
  .stack { display: flex; flex-direction: column; }
  .form-card {
    width: 100%;
    max-width: 460px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: clamp(24px, 4vw, 40px);
  }
  .eyebrow-mark {
    width: 40px; height: 4px; background: var(--green); border-radius: 4px; margin-bottom: 18px;
  }
  h1.screen-title {
    font-family: var(--font-display);
    font-size: clamp(24px, 3vw, 30px);
    font-weight: 700;
    color: var(--denim);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  p.screen-sub {
    color: var(--text-secondary);
    font-size: 15px;
    line-height: 1.55;
    margin: 0 0 28px;
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--denim);
    margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px;
    color: var(--text);
    background: var(--white);
    outline: none;
    transition: border-color 140ms ease, box-shadow 140ms ease;
  }
  .field input::placeholder { color: #98A2B3; }
  .field input:focus, .field select:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px var(--green-100);
  }
  .field textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; font-family: inherit; color: var(--text); background: var(--white); outline: none; resize: vertical; }
  .field textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-100); }
  .field input.invalid { border-color: var(--danger); }
  .field-error { font-size: 12.5px; color: var(--danger); margin-top: 5px; display: none; }
  .field-error.show { display: block; }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }

  .file-drop {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius-sm);
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg);
    cursor: pointer;
  }
  .file-drop:hover { border-color: var(--green); }
  .file-drop-icon {
    width: 38px; height: 38px; border-radius: 10px; background: var(--white);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    border: 1px solid var(--border); color: var(--green);
  }
  .file-drop-text { font-size: 13.5px; }
  .file-drop-text strong { color: var(--denim); display: block; font-size: 14px; }
  .file-drop.done { border-style: solid; border-color: var(--green); }
  .file-drop.done .file-drop-text strong { color: var(--green-600); }

  .checkbox-row {
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 13.5px; color: var(--text-secondary); margin: 18px 0 22px; line-height: 1.5;
  }
  .checkbox-row input { margin-top: 3px; accent-color: var(--green); width: 16px; height: 16px; flex-shrink: 0; }
  .checkbox-row a { color: var(--green-600); font-weight: 600; text-decoration: underline; }

  .divider-row {
    display: flex; align-items: center; gap: 12px; margin: 20px 0;
    color: var(--text-secondary); font-size: 12.5px; font-weight: 500;
  }
  .divider-row::before, .divider-row::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .switch-line { text-align: center; margin-top: 22px; font-size: 14px; color: var(--text-secondary); }
  .switch-line button { background: none; border: none; color: var(--green-600); font-weight: 700; padding: 0; font-size: 14px; }
  .switch-line button:hover { text-decoration: underline; }

  .toast {
    position: fixed;
    left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(12px);
    background: var(--denim); color: var(--white);
    padding: 12px 20px; border-radius: 12px; font-size: 13.5px; font-weight: 500;
    box-shadow: 0 10px 30px rgba(18,48,74,0.25);
    opacity: 0; pointer-events: none; transition: opacity 200ms ease, transform 200ms ease;
    z-index: 50; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Welcome ---------- */
  .welcome-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    overflow: hidden;
    padding: 40px 24px 60px;
  }
  .welcome-scene {
    position: absolute; inset: 0; z-index: 0; opacity: 0.9;
    pointer-events: none;
  }
  .welcome-inner { position: relative; z-index: 1; max-width: 560px; }
  .welcome-logo { margin-bottom: 22px; animation: fadeUp 700ms ease both; }
  .welcome-word {
    font-family: var(--font-display); font-weight: 700; color: var(--denim);
    font-size: 15px; letter-spacing: 0.02em; margin-bottom: 2px; animation: fadeUp 700ms 60ms ease both;
  }
  .welcome-tagline {
    color: var(--green-600); font-weight: 600; font-size: 13px; margin-bottom: 34px;
    animation: fadeUp 700ms 100ms ease both;
  }
  h1.welcome-heading {
    font-family: var(--font-display);
    font-size: clamp(32px, 6vw, 46px);
    font-weight: 700;
    color: var(--denim);
    margin: 0 0 14px;
    letter-spacing: -0.02em;
    line-height: 1.08;
    animation: fadeUp 700ms 160ms ease both;
  }
  p.welcome-sub {
    font-size: clamp(15px, 2vw, 17px);
    color: var(--text-secondary);
    margin: 0 0 36px;
    animation: fadeUp 700ms 220ms ease both;
  }
  .welcome-actions {
    display: flex; flex-direction: column; gap: 12px; max-width: 320px; margin: 0 auto;
    animation: fadeUp 700ms 280ms ease both;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  /* ---------- Role select ---------- */
  .role-header { text-align: center; max-width: 560px; margin: 0 auto 40px; }
  .role-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    max-width: 1040px;
    width: 100%;
    margin: 0 auto;
  }
  @media (min-width: 860px) {
    .role-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; }
  }
  .role-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px 24px;
    text-align: left;
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
    transition: transform 160ms ease, border-color 160ms ease;
  }
  .role-card:hover { transform: translateY(-3px); border-color: var(--green); }
  .role-icon {
    width: 48px; height: 48px; border-radius: 13px;
    background: var(--green-100); color: var(--green-600);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
  }
  .role-card h3 {
    font-family: var(--font-display);
    font-size: 19px; color: var(--denim); margin: 0 0 8px; font-weight: 700;
  }
  .role-card p { font-size: 14px; color: var(--text-secondary); line-height: 1.55; margin: 0 0 22px; flex: 1; }
  .role-card .btn { width: auto; align-self: flex-start; padding: 10px 18px; font-size: 14px; }
  .role-card .btn-primary { background: var(--green); }
  .role-card .btn-primary:hover { background: var(--green-600); }

  /* ---------- Agent type ---------- */
  .type-grid {
    display: grid; grid-template-columns: 1fr; gap: 16px; max-width: 720px; width: 100%; margin: 0 auto;
  }
  @media (min-width: 640px) { .type-grid { grid-template-columns: 1fr 1fr; } }
  .type-card {
    background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius-lg);
    padding: 26px 22px; text-align: left; box-shadow: var(--shadow-card);
  }
  .type-card .type-emoji-icon {
    width: 46px; height: 46px; border-radius: 12px; background: var(--denim-100);
    display: flex; align-items: center; justify-content: center; margin-bottom: 16px; color: var(--denim);
  }
  .type-card h3 { font-family: var(--font-display); font-size: 18px; color: var(--denim); margin: 0 0 6px; }
  .type-card > p { font-size: 13.5px; color: var(--text-secondary); margin: 0 0 14px; }
  .type-card ul { margin: 0 0 20px; padding-left: 18px; color: var(--text-secondary); font-size: 13px; line-height: 1.9; }
  .type-card .btn { padding: 11px 16px; font-size: 14px; }

  /* ---------- Success screens ---------- */
  .success-wrap { text-align: center; max-width: 440px; margin: 0 auto; }
  .success-badge {
    width: 68px; height: 68px; border-radius: 50%; background: var(--green-100); color: var(--green-600);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 22px;
  }
  .status-pill {
    display: inline-flex; align-items: center; gap: 7px;
    background: #FDF3E7; color: #9A6B12; border: 1px solid #F3DDAF;
    font-size: 12.5px; font-weight: 700; padding: 7px 14px; border-radius: 100px; margin: 18px 0 6px;
  }
  .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: #C98A1E; }

  /* ---------- Dashboard placeholder ---------- */
  .dash-wrap {
    max-width: 720px; width: 100%; margin: 0 auto; text-align: center;
  }
  .dash-card {
    background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: clamp(32px, 6vw, 56px) clamp(20px, 5vw, 40px); box-shadow: var(--shadow-card);
  }
  .dash-role-tag {
    display: inline-block; background: var(--denim-100); color: var(--denim);
    font-size: 12.5px; font-weight: 700; padding: 6px 14px; border-radius: 100px; margin-bottom: 18px;
  }

  /* ---------- Utility ---------- */
  .hidden { display: none !important; }
  .icon { display: inline-flex; }
  svg { display: block; }

  /* Dark mode support (system) */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --white: #16384D;
      --surface: #102B3F;
      --bg: #081923;
      --text: #F8FAFC;
      --text-secondary: #C2CDD6;
      --text-muted: #9FB0BC;
      --border: #2A5065;
      --denim-100: rgba(255,255,255,0.08);
      --green: #28A86B;
      --green-600: #34C97F;
      --green-100: rgba(40,168,107,0.18);
      --amber-bg: rgba(201,138,30,0.18);
      --amber-border: rgba(201,138,30,0.4);
    }
    :root:not([data-theme="light"]) body { background: var(--bg); }
    :root:not([data-theme="light"]) .brand-word,
    :root:not([data-theme="light"]) h1.screen-title,
    :root:not([data-theme="light"]) h1.welcome-heading,
    :root:not([data-theme="light"]) .role-card h3,
    :root:not([data-theme="light"]) .type-card h3,
    :root:not([data-theme="light"]) .field label,
    :root:not([data-theme="light"]) .btn-outline,
    :root:not([data-theme="light"]) .btn-ghost,
    :root:not([data-theme="light"]) .file-drop-text strong,
    :root:not([data-theme="light"]) .page-title-row h1,
    :root:not([data-theme="light"]) h1.dash-greeting,
    :root:not([data-theme="light"]) .section-heading h2,
    :root:not([data-theme="light"]) .action-card h3,
    :root:not([data-theme="light"]) .quick-card strong,
    :root:not([data-theme="light"]) .ae-item-name,
    :root:not([data-theme="light"]) .status-chip.done,
    :root:not([data-theme="light"]) .agent-type-tag,
    :root:not([data-theme="light"]) .agent-fee,
    :root:not([data-theme="light"]) .seller-icon,
    :root:not([data-theme="light"]) .payment-note strong,
    :root:not([data-theme="light"]) .stat-box b,
    :root:not([data-theme="light"]) .otp-digit,
    :root:not([data-theme="light"]) .profile-hero-name,
    :root:not([data-theme="light"]) .settings-item .si-icon,
    :root:not([data-theme="light"]) .notif-icon,
    :root:not([data-theme="light"]) .dash-role-tag,
    :root:not([data-theme="light"]) .chat-bubble-wrap.agent .voice-play-btn,
    :root:not([data-theme="light"]) .sidebar-link:hover,
    :root:not([data-theme="light"]) .in-page-back:hover { color: #F8FAFC; }
    :root:not([data-theme="light"]) .field input::placeholder,
    :root:not([data-theme="light"]) .search-bar input::placeholder,
    :root:not([data-theme="light"]) .chat-input-bar input::placeholder { color: #9FB0BC; }
  }
  :root[data-theme="dark"] {
    --white: #16384D;
    --surface: #102B3F;
    --bg: #081923;
    --text: #F8FAFC;
    --text-secondary: #C2CDD6;
    --text-muted: #9FB0BC;
    --border: #2A5065;
    --denim-100: rgba(255,255,255,0.08);
    --green: #28A86B;
    --green-600: #34C97F;
    --green-100: rgba(40,168,107,0.18);
    --amber-bg: rgba(201,138,30,0.18);
    --amber-border: rgba(201,138,30,0.4);
  }
  :root[data-theme="dark"] .brand-word,
  :root[data-theme="dark"] h1.screen-title,
  :root[data-theme="dark"] h1.welcome-heading,
  :root[data-theme="dark"] .role-card h3,
  :root[data-theme="dark"] .type-card h3,
  :root[data-theme="dark"] .field label,
  :root[data-theme="dark"] .btn-outline,
  :root[data-theme="dark"] .btn-ghost,
  :root[data-theme="dark"] .file-drop-text strong,
  :root[data-theme="dark"] .page-title-row h1,
  :root[data-theme="dark"] h1.dash-greeting,
  :root[data-theme="dark"] .section-heading h2,
  :root[data-theme="dark"] .action-card h3,
  :root[data-theme="dark"] .quick-card strong,
  :root[data-theme="dark"] .ae-item-name,
  :root[data-theme="dark"] .status-chip.done,
  :root[data-theme="dark"] .agent-type-tag,
  :root[data-theme="dark"] .agent-fee,
  :root[data-theme="dark"] .seller-icon,
  :root[data-theme="dark"] .payment-note strong,
  :root[data-theme="dark"] .stat-box b,
  :root[data-theme="dark"] .otp-digit,
  :root[data-theme="dark"] .profile-hero-name,
  :root[data-theme="dark"] .settings-item .si-icon,
  :root[data-theme="dark"] .notif-icon,
  :root[data-theme="dark"] .dash-role-tag,
  :root[data-theme="dark"] .chat-bubble-wrap.agent .voice-play-btn,
  :root[data-theme="dark"] .sidebar-link:hover,
  :root[data-theme="dark"] .in-page-back:hover { color: #F8FAFC; }
  :root[data-theme="dark"] .field input::placeholder,
  :root[data-theme="dark"] .search-bar input::placeholder,
  :root[data-theme="dark"] .chat-input-bar input::placeholder { color: #9FB0BC; }


  /* ================= PHASE 2 — Buyer App Shell ================= */
  .app-layout { display: flex; flex: 1; min-height: 0; width: 100%; }
  .sidebar {
    width: 236px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
    display: none; flex-direction: column; padding: 20px 14px;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    position: sticky; top: 0; align-self: flex-start; height: 100vh; overflow-y: auto;
  }
  @media (min-width: 960px) { .sidebar { display: flex; } }
  .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 20px; }
  .sidebar-brand .brand-word { font-size: 17px; }
  .sidebar-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .sidebar-link {
    display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: var(--radius-sm);
    color: var(--text-secondary); font-size: 14px; font-weight: 600; background: none; border: none;
    text-align: left; width: 100%;
  }
  .sidebar-link:hover { background: var(--bg); color: var(--denim); }
  .sidebar-link.active { background: var(--green-100); color: var(--green-600); }
  .sidebar-link .icon { display: flex; flex-shrink: 0; }
  .sidebar-footer { display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 10px; }

  .app-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .app-header {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 14px clamp(16px, 4vw, 32px); padding-top: calc(14px + env(safe-area-inset-top, 0px));
    border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 6;
  }
  .app-header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .app-header-left .brand-word { font-size: 16px; }
  @media (min-width: 960px) { .app-header-left .brand { display: none; } }

      } catch(e){ return fallback; }
    },
    set(key, val){
      try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){ /* storage unavailable */ }

    const root = document.documentElement;

    else if(theme === 'dark'){ root.setAttribute('data-theme', 'dark'); }
    else { root.removeAttribute('data-theme'); }
  }

  /* ---------------- Demo data ---------------- */

  function fmtNaira(n){ return '₦' + Number(n).toLocaleString('en-NG'); }

    const diff = Math.max(0, Date.now() - new Date(iso).getTime());
    const m = Math.floor(diff/60000);
    if(m < 1) return 'just now';
    if(m < 60) return m + 'm ago';
    const h = Math.floor(m/60);
    if(h < 24) return h + 'h ago';

  function createCommissionForErrand(errand){
    if(!errand.agentId) return null;
    if(commissions.some(c=>c.errandId===errand.id)) return null; // unique per errand
    const fee = Number(errand.agentFee)||0;
    const amount = Math.round(fee * COMMISSION_RATE);
    const rec = {
      id:'cm_'+Date.now()+Math.random().toString(16).slice(2,6),
      errandId: errand.id, agentId: errand.agentId,
      agentFee: fee, commissionRate: COMMISSION_RATE, rateVersion: COMMISSION_RATE_VERSION,
      commissionAmount: amount, status: amount > 0 ? 'PENDING' : 'PAID',
      paymentReference:'', paymentTransactionId:'',
      initiatedAt:null, paidAt: amount>0?null:new Date().toISOString(),
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
    };
    commissions.push(rec);
    saveCommissions();
    if(amount > 0){
      pushNotificationFor(errand.agentId, 'Commission Payment Required', `You owe ${fmtNaira(amount)} commission on errand ${'#'+String(errand.id).slice(-6).toUpperCase()}. Settle it to stay available for new errands.`, 'commission');
    }
    return rec;
  }
  function agentOutstandingCommissions(agentId){
    return commissions.filter(c=> c.agentId===agentId && ['PENDING','PAYMENT_INITIATED','PAYMENT_FAILED','REQUIRES_REVIEW'].includes(c.status));
  }
  function agentHasOutstandingCommission(agentId){
    return agentOutstandingCommissions(agentId).length > 0;
  }

  function isMerchantUser(u){ return !!u && u.role === 'seller'; }

    return {

      distanceKm: u.distanceKm != null ? u.distanceKm : 1.5,
      rating: u.rating || 5.0, open: u.isOpen !== false,
      area: (u.address ? u.address : '') + (u.city ? ', ' + u.city : ''),
      hours: (u.openingTime && u.closingTime) ? (u.openingTime + ' – ' + u.closingTime) : '9:00 AM – 6:00 PM',
      description: u.description || 'Merchant on Urban Errand.',
      isRealMerchant: true
    };
  }
  function getAllStores(){
    const real = users.filter(u => isMerchantUser(u)).map(normalizeMerchantUser);

  function pushNotificationFor(userId, title, message, type){
    if(!userId) return;

      if(key && target.notifPrefs[key] === false) return;

    notifications.unshift({ id:'n_'+Date.now()+Math.random().toString(16).slice(2,6), userId, title, message, type: type||'info', read:false, createdAt: new Date().toISOString() });

  function markInvalid(input, errEl, msg){
    input.classList.add('invalid');
    if(errEl){ errEl.textContent = msg; errEl.classList.add('show'); }
  }
  function clearInvalid(input, errEl){
    input.classList.remove('invalid');
    if(errEl){ errEl.classList.remove('show'); }
  }

  function wireLiveClear(form){
    form.querySelectorAll('input, select').forEach(inp=>{

  /* ---------------- Router ---------------- */

    if(isAdminUser(currentUser)) return 'admin-dashboard';
    return 'dashboard';
  }

          chip.classList.add('selected');
          const val = chip.getAttribute('data-val');
          credState[c.key].declared = val;
          if(val !== 'yes'){ delete holder[c.docType]; credState[c.key].uploaded = false; }
          root.querySelector(`#reassure-${c.key}`).classList.toggle('hidden', val !== 'no');
          root.querySelector(`#upload-wrap-${c.key}`).classList.toggle('hidden', val !== 'yes');

      const credentials = {};
      OPTIONAL_CREDENTIALS.forEach(c=>{

        if(declared !== 'yes') delete holder[c.docType];
        const has = declared === 'yes' && !!holder[c.docType];
        credentials[c.key] = { declared, uploaded: has, status: credentialStatus({ declared, uploaded: has }) };

        status: 'pending', createdAt: new Date().toISOString()
      };
      if(!submitApplication(user, holder)){ errEl.textContent = 'Browser storage is full. This prototype keeps uploaded files in your browser (about 5 MB in total) — try smaller photos or a smaller PDF.'; errEl.classList.add('show'); return; }
      users.push(user); saveUsers();
      currentUser = user; saveSession();
      notifyAdmins('New Merchant Application', applicantName(user) + ' submitted a merchant application with ' + docsFor(user.id).length + ' document(s).', 'system');
      go('seller-success');

  function dashStepIndex(status){
    const map = { AGENT_CONFIRMED:'AGENT_SELECTED', PRICE_CHANGE_REQUESTED:'ARRIVED_AT_SELLER', PRICE_CHANGE_REJECTED:'ARRIVED_AT_SELLER', ITEM_CONFIRMED:'ARRIVED_AT_SELLER', MERCHANT_CONFIRMATION_REQUIRED:'AGENT_SELECTED', MERCHANT_CONFIRMED:'AGENT_SELECTED', PREPARING:'AGENT_SELECTED', READY_FOR_PICKUP:'ARRIVED_AT_SELLER', AGENT_ARRIVED:'ARRIVED_AT_SELLER', ARRIVED_AT_CUSTOMER:'IN_TRANSIT', PAYMENT_CONFIRMED:'DELIVERED', COMPLETED:'DELIVERED' };
    const idx = DASH_PROGRESS_STEPS.indexOf(map[status] || status);
    return idx === -1 ? 0 : idx;
  }
  function trackStepIndex(status){
    const map = { AGENT_CONFIRMED:'AGENT_SELECTED', PRICE_CHANGE_REQUESTED:'ARRIVED_AT_SELLER', PRICE_CHANGE_REJECTED:'ARRIVED_AT_SELLER', ITEM_CONFIRMED:'ARRIVED_AT_SELLER', MERCHANT_CONFIRMATION_REQUIRED:'AGENT_SELECTED', MERCHANT_CONFIRMED:'AGENT_SELECTED', PREPARING:'AGENT_SELECTED', READY_FOR_PICKUP:'GOING_TO_SELLER', AGENT_ARRIVED:'ARRIVED_AT_SELLER', PAYMENT_CONFIRMED:'DELIVERED', COMPLETED:'DELIVERED', ARRIVED_AT_CUSTOMER:'IN_TRANSIT' };
    const idx = TRACK_STEPS.findIndex(s=> s.key === (map[status] || status));
    return idx === -1 ? 0 : idx;
  }

  /* ---- Create Errand wizard ---- */
  function defaultWizard(){
    return {
      step: 1, itemMode:'store',
      itemName:'', description:'', quantity:1, itemSize:'light', budget:'', instructions:'',
      sellerMode:'choose', sellerId:null, sellerName:'', sellerAddress:'',
      deliveryAddress: currentUser.address || '', city: currentUser.city || '',
      recipientName: currentUser.fullName || '', recipientPhone: currentUser.phone || '', deliveryInstructions:'',
      agentId: null
    };
  }
  function rerenderWizard(){ renderWizardStep(document.getElementById('app-content')); }

  function suitableAgents(w){
    const sizeRank = {light:1, medium:2, heavy:3};
    const need = sizeRank[w.itemSize] || 1;
    const store = findStore(w.sellerId);
    const distanceProxy = store ? store.distanceKm : (w.itemSize==='heavy' ? 6 : 2);
    return getAllAgents().filter(a=>{
      if(!a.online) return false;
      const cap = sizeRank[a.maxSize] || 1;
      if(cap < need) return false;
      if(distanceProxy > a.maxKm) return false;
      return true;
    });
  }

  SCREENS['create-errand'] = function(root){
    if(!wizard){ wizard = defaultWizard(); }
    renderWizardStep(root);
  };

  function renderWizardStep(root){
    const steps = ['Item','Merchant','Delivery','Agent','Review'];
    root.innerHTML = `
      ${pageHeader('Create an Errand')}
      <div class="wizard-progress">
        ${steps.map((s,i)=>{
          const n=i+1;
          const cls = n<wizard.step?'done':n===wizard.step?'active':'';
          return `<span class="w-step ${cls}"><span class="w-num">${n<wizard.step?'✓':n}</span>${s}</span>${i<steps.length-1?'<span class="w-sep"></span>':''}`;
        }).join('')}
      </div>
      <div class="wizard-card" id="wizard-step-body"></div>
    `;
    wirePageBack(root);
    const body = root.querySelector('#wizard-step-body');
    if(wizard.step===1) renderWStep1(body);
    else if(wizard.step===2) renderWStep2(body);
    else if(wizard.step===3) renderWStep3(body);
    else if(wizard.step===4) renderWStep4(body);
    else renderWStep5(body);
  }

        id: 'er_'+now,

        itemName: (w.quantity>1?w.quantity+'x ':'') + w.itemName,

        agentFee: agent ? agent.fee : 0,
        status: 'AGENT_SELECTED', paymentConfirmed: false,
        createdAt: new Date().toISOString(),
        statusHistory: [
          { status:'REQUESTED', timestamp:new Date(now-2*60000).toISOString(), notes:'' },
          { status:'AGENT_SELECTED', timestamp:new Date().toISOString(), notes:'' }
        ],
        messages: agent ? [{ id:'m0', sender:'agent', text:`Hi ${currentUser.fullName.split(' ')[0]}, I've got your errand — heading to ${w.sellerName} now.`, time:new Date().toISOString() }] : []
      };

      if(chosenStore && chosenStore.isRealMerchant){
        pushNotificationFor(chosenStore.id, 'New Errand Request', `${currentUser.fullName} selected ${w.itemName} from your store.`, 'new-request');
        if(agent && !agent.isRealUser){
          errand.status = 'MERCHANT_CONFIRMATION_REQUIRED';

          errand.statusHistory.push({ status:'AGENT_CONFIRMED', timestamp:new Date().toISOString(), notes:'' }, { status:'MERCHANT_CONFIRMATION_REQUIRED', timestamp:new Date().toISOString(), notes:'' });
          pushNotificationFor(chosenStore.id, 'Action Required', `Please confirm ${w.itemName} for ${currentUser.fullName}.`, 'action-required');

      saveErrands();

      currentOrderId = errand.id;
      wizard = null;
      history = [];
      go('order-tracking', {replace:true});
    });
  }

  function priceChangeHTML(errand, agent){

  function paintTracking(root, errand){
    const agent = findAgent(errand.agentId);
    const stepIdx = trackStepIndex(errand.status);
    let bodyHTML;
    if(errand.status === 'PRICE_CHANGE_REQUESTED' && errand.priceChange && errand.priceChange.status === 'requested'){
      bodyHTML = trackingMainHTML(errand, agent, stepIdx) + priceChangeHTML(errand, agent);
    } else if(errand.status === 'ITEM_UNAVAILABLE' && errand.unavailable){
      const u = errand.unavailable;
      bodyHTML = `
        <div class="active-errand-card" style="margin-top:18px;">
          <div style="font-weight:700;color:var(--text);margin-bottom:6px;">Item Unavailable</div>
          <p style="font-size:13px;color:var(--text-secondary);margin:0 0 12px;">${escHtml(errand.sellerName)} can't supply ${escHtml(errand.itemName)}.</p>
          <div class="review-row"><span class="r-label">Reason</span><span class="r-value">${escHtml(u.reason||'Not specified')}</span></div>
          ${u.alternative ? `<div class="review-row"><span class="r-label">Suggested alternative</span><span class="r-value">${escHtml(u.alternative)}${u.altPrice?' · '+fmtNaira(u.altPrice):''}</span></div>` : ''}
          <p style="font-size:12.5px;color:var(--text-secondary);margin:12px 0 0;">Nothing will be substituted without your approval. Create a new errand to request the alternative.</p>
          <button class="btn btn-primary" id="unavail-new-errand" style="margin-top:14px;">Create a New Errand</button>
        </div>`;
    } else if(errand.status === 'ARRIVED_AT_CUSTOMER'){
      bodyHTML = trackingMainHTML(errand, agent, stepIdx) + otpConfirmHTML(errand, agent);
    } else if(errand.status === 'DELIVERED' && !errand.paymentConfirmed){
      bodyHTML = paymentConfirmHTML(errand, agent);
    } else if(errand.paymentConfirmed && !errand.rating && errand.status !== 'COMPLETED'){
      bodyHTML = ratingHTML(errand, agent);
    } else if(errand.status === 'COMPLETED'){
      bodyHTML = completedHTML(errand);
    } else {
      bodyHTML = trackingMainHTML(errand, agent, stepIdx);
    }
    root.innerHTML = pageHeader('Tracking Your Errand') + bodyHTML;
    wirePageBack(root);
    wireTrackingActions(root, errand, agent);
    const unavailNew = root.querySelector('#unavail-new-errand');
    if(unavailNew) unavailNew.addEventListener('click', ()=>{ wizard = defaultWizard(); go('create-errand'); });
    const priceApprove = root.querySelector('#price-approve-btn');
    if(priceApprove){
      priceApprove.addEventListener('click', ()=>{
        errand.priceChange.status = 'approved';
        saveErrands();
        if(errand.agentId) pushNotificationFor(errand.agentId, 'Price Approved', 'The customer approved the updated item price. You can continue the errand.', 'price-change');
        toast('Price change approved.');
        paintTracking(document.getElementById('app-content'), errand);
      });
    }
    const priceReject = root.querySelector('#price-reject-btn');
    if(priceReject){
      priceReject.addEventListener('click', ()=>{
        errand.priceChange.status = 'rejected';
        saveErrands();
        if(errand.agentId) pushNotificationFor(errand.agentId, 'Price Rejected', 'The customer rejected the updated item price. Please contact them.', 'price-change');
        toast('Price change rejected — your agent has been notified.');
        paintTracking(document.getElementById('app-content'), errand);
      });
    }
  }
  SCREENS['order-tracking'] = function(root){
    const errand = errands.find(e=>e.id===currentOrderId);
    if(!errand){ root.innerHTML = pageHeader('Tracking'); wirePageBack(root); return; }
    paintTracking(root, errand);
    const trackingAgent = findAgent(errand.agentId);
    const autoStatuses = ['GOING_TO_SELLER','ARRIVED_AT_SELLER','ITEM_CONFIRMED','PICKED_UP','IN_TRANSIT','ARRIVED_AT_CUSTOMER'];
    const trackingStore = findStore(errand.sellerId);
    if((!trackingAgent || !trackingAgent.isRealUser) && !(trackingStore && trackingStore.isRealMerchant)){
    if(errand.status === 'AGENT_SELECTED' || autoStatuses.includes(errand.status)){
      if(errand.status !== 'ARRIVED_AT_CUSTOMER'){
        trackingTimer = setInterval(()=>{
          const idx = autoStatuses.indexOf(errand.status);
          const nextIdx = errand.status === 'AGENT_SELECTED' ? 0 : idx + 1;
          if(nextIdx >= autoStatuses.length){ clearInterval(trackingTimer); trackingTimer = null; return; }
          errand.status = autoStatuses[nextIdx];
          pushHistory(errand, errand.status);
          if(errand.status === 'ARRIVED_AT_SELLER'){
            errand.messages = errand.messages || [];
            errand.messages.push({ id:'sys_'+Date.now(), sender:'agent', type:'system', text: (findAgent(errand.agentId)||{}).name + ' has arrived at the store.', time:new Date().toISOString() });
          }
          saveErrands();
          if(errand.status === 'ARRIVED_AT_CUSTOMER'){
            pushNotification('Agent Nearby', 'Your agent is almost at your location.', 'nearby');
            clearInterval(trackingTimer); trackingTimer = null;
          } else if(errand.status === 'PICKED_UP'){
            pushNotification('Item Picked Up', (findAgent(errand.agentId)||{}).name + ' has picked up your item.', 'pickup');
          }
          const liveRoot = document.getElementById('app-content');
          if(liveRoot && currentOrderId === errand.id){ paintTracking(liveRoot, errand); }
        }, 4200);
      }
    }
    }
  };

    closeCallOverlay();
    const el = document.createElement('div');

    el.id = 'call-overlay';
    el.innerHTML = `
      <div>
        <div class="call-avatar">${initials(agent.name)}</div>

        </div>
      </div>

      callTimer = setInterval(()=>{
        seconds++;
        const m = String(Math.floor(seconds/60)).padStart(2,'0');
        const s = String(seconds%60).padStart(2,'0');
        const live = document.getElementById('call-status-text');
        if(live) live.textContent = `${m}:${s}`;
      }, 1000);
    }, 1600);
    el.querySelector('#call-mute-btn').addEventListener('click', function(){ this.classList.toggle('active'); });
    el.querySelector('#call-speaker-btn').addEventListener('click', function(){ this.classList.toggle('active'); });
    el.querySelector('#call-end-btn').addEventListener('click', closeCallOverlay);

  SCREENS['chat'] = function(root){
    const errand = errands.find(e=>e.id===currentChatErrandId);
    if(!errand){ root.innerHTML = pageHeader('Chat'); wirePageBack(root); return; }
    const agent = findAgent(errand.agentId);
    errand.messages = errand.messages || [];
    root.innerHTML = pageHeader('Chat') + `
      <div class="chat-shell">
        <div class="chat-header">
          <div class="avatar">${agent?initials(agent.name):'A'}</div>
          <div style="flex:1;"><div class="agent-name">${agent?agent.name:'Agent'}</div><span class="online-dot"><span class="dot"></span>Online</span></div>
          <button class="icon-btn" id="chat-call-btn" title="Call">${ICON.phone}</button>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-bar" id="chat-input-row">
          <button class="chat-icon-btn" id="chat-attach-btn" title="Attachment">${ICON.image}</button>
          <button class="chat-icon-btn" id="chat-mic-btn" title="Voice note">${ICON.mic}</button>
          <input type="text" id="chat-input" placeholder="Type a message...">
          <button class="chat-send-btn" id="chat-send-btn">${ICON.send}</button>
        </div>
        <div class="chat-record-bar" id="chat-record-bar">
          <span class="record-dot"></span>
          <span class="record-time" id="record-time-label">Recording 0:00</span>
          <button class="record-cancel-btn" id="record-cancel-btn" title="Cancel">✕</button>
          <button class="record-send-btn" id="record-send-btn" title="Send">${ICON.send}</button>
        </div>
        <input type="file" id="chat-file-input" accept="image/*" style="display:none;">
      </div>
    `;
    wirePageBack(root);
    const msgBox = root.querySelector('#chat-messages');

    function voiceMsgHTML(m){
      return `<div class="voice-msg" data-voice="${m.id}" data-duration="${m.duration}">
        <button class="voice-play-btn" data-play="${m.id}">▶</button>
        <div class="voice-progress-track"><div class="voice-progress-fill" id="fill-${m.id}"></div></div>
        <span class="voice-duration">0:${String(m.duration).padStart(2,'0')}</span>
      </div>`;
    }
    function paintMessages(){
      msgBox.innerHTML = errand.messages.map(m=>{
        const type = m.type || 'text';
        if(type === 'system'){
          return `<div class="chat-system-msg">${escHtml(m.text)}</div>`;
        }
        let inner;
        if(type === 'image'){ inner = `<div class="chat-image-msg"><img src="${m.imageUrl}" alt="attachment"></div>`; }
        else if(type === 'voice'){ inner = voiceMsgHTML(m); }
        else { inner = escHtml(m.text); }
        return `
          <div class="chat-bubble-wrap ${m.sender}">
            <div class="chat-bubble">${inner}</div>
            <div class="chat-time">${new Date(m.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
          </div>
        `;
      }).join('');
      msgBox.scrollTop = msgBox.scrollHeight;
      msgBox.querySelectorAll('[data-play]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const id = btn.getAttribute('data-play');
          const m = errand.messages.find(x=>x.id===id);
          const fill = document.getElementById('fill-'+id);
          if(!m || !fill || btn.disabled) return;
          btn.disabled = true;
          const totalMs = Math.max(1, m.duration) * 1000;
          const start = Date.now();
          const t = setInterval(()=>{
            const pct = Math.min(100, ((Date.now()-start)/totalMs)*100);
            fill.style.width = pct + '%';
            if(pct >= 100){ clearInterval(t); btn.disabled = false; fill.style.width = '0%'; }
          }, 80);
        });
      });
    }
    paintMessages();

    root.querySelector('#chat-call-btn').addEventListener('click', ()=>{
      if(agent){ openCallOverlay(agent); } else { toast("This agent isn't available to call yet."); }
    });

    const fileInput = root.querySelector('#chat-file-input');
    root.querySelector('#chat-attach-btn').addEventListener('click', ()=> fileInput.click());
    fileInput.addEventListener('change', ()=>{
      const file = fileInput.files && fileInput.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        errand.messages.push({ id:'m_'+Date.now(), sender:'buyer', type:'image', imageUrl: reader.result, time:new Date().toISOString() });
        saveErrands(); paintMessages();
        setTimeout(()=>{
          errand.messages.push({ id:'m_'+(Date.now()+1), sender:'agent', type:'text', text: 'Got the photo, thanks — noted.', time:new Date().toISOString() });
          saveErrands(); paintMessages();
        }, 1200);
      };
      reader.readAsDataURL(file);
      fileInput.value = '';
    });

    const recordBar = root.querySelector('#chat-record-bar');
    const inputRow = root.querySelector('#chat-input-row');
    let recordSeconds = 0;
    function updateRecordLabel(){
      const m = Math.floor(recordSeconds/60), s = recordSeconds%60;
      root.querySelector('#record-time-label').textContent = `Recording ${m}:${String(s).padStart(2,'0')}`;
    }
    function startRecording(){
      recordSeconds = 0;
      updateRecordLabel();
      inputRow.style.display = 'none';
      recordBar.classList.add('active');
      recordTimer = setInterval(()=>{ recordSeconds++; updateRecordLabel(); }, 1000);
    }
    function stopRecording(){
      if(recordTimer){ clearInterval(recordTimer); recordTimer = null; }
      recordBar.classList.remove('active');
      inputRow.style.display = 'flex';
    }
    root.querySelector('#chat-mic-btn').addEventListener('click', startRecording);
    root.querySelector('#record-cancel-btn').addEventListener('click', stopRecording);
    root.querySelector('#record-send-btn').addEventListener('click', ()=>{
      const duration = Math.max(1, recordSeconds);
      stopRecording();
      errand.messages.push({ id:'m_'+Date.now(), sender:'buyer', type:'voice', duration, time:new Date().toISOString() });
      saveErrands(); paintMessages();
      setTimeout(()=>{
        errand.messages.push({ id:'m_'+(Date.now()+1), sender:'agent', type:'text', text: pickAutoReply(), time:new Date().toISOString() });
        saveErrands(); paintMessages();
      }, 1200);
    });

    function send(){
      const input = root.querySelector('#chat-input');
      const text = input.value.trim();
      if(!text) return;
      errand.messages.push({ id:'m_'+Date.now(), sender:'buyer', type:'text', text, time:new Date().toISOString() });
      saveErrands(); input.value=''; paintMessages();
      setTimeout(()=>{
        errand.messages.push({ id:'m_'+(Date.now()+1), sender:'agent', type:'text', text: pickAutoReply(), time:new Date().toISOString() });
        saveErrands(); paintMessages();
      }, 1200);
    }
    root.querySelector('#chat-send-btn').addEventListener('click', send);
    root.querySelector('#chat-input').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ send(); } });

  /* ================= PHASE 3 — Agent Interface ================= */

  function isSameDay(a,b){ const d1=new Date(a), d2=new Date(b); return d1.toDateString()===d2.toDateString(); }
  function isToday(iso){ return isSameDay(iso, new Date()); }
  function isWithinDays(iso, days){ return (Date.now() - new Date(iso).getTime()) <= days*24*3600000; }
  function completedTimestamp(e){
    const h = (e.statusHistory||[]).slice().reverse().find(x=> x.status==='COMPLETED' || x.status==='PAYMENT_CONFIRMED');
    return h ? h.timestamp : e.createdAt;
  }
  function sumEarnings(list, period){
    const eligible = list.filter(e=> ['COMPLETED','PAYMENT_CONFIRMED'].includes(e.status));
    return eligible.filter(e=>{
      const t = completedTimestamp(e);
      if(period==='today') return isToday(t);
      if(period==='week') return isWithinDays(t,7);
      if(period==='month') return isWithinDays(t,30);
      return true;
    }).reduce((sum,e)=> sum + (e.agentFee||0), 0);
  }
  function myAgentErrands(){ return errands.filter(e=> e.agentId===currentUser.id); }
  function saveCurrentAgentUser(){

    AGENT_ARRIVED: 'Your agent has arrived at the merchant.',
    PICKED_UP: 'Your item has been picked up.',
    IN_TRANSIT: 'Your agent is on the way.',
    ARRIVED_AT_CUSTOMER: 'Your agent has arrived at your location.',
    DELIVERED: 'Your item has been delivered.'
  };
  function agentAdvanceStatus(e, nextStatus, note){
    e.status = nextStatus;
    pushHistory(e, nextStatus, note||'');
    saveErrands();
    if(e.buyerId && STATUS_SYNC_MSG[nextStatus]){
      pushNotificationFor(e.buyerId, 'Errand Update', STATUS_SYNC_MSG[nextStatus], 'update');

    if(nextStatus === 'AGENT_ARRIVED' && e.sellerId){

    const payShortcut = root.querySelector('#go-pay-commission');
    if(payShortcut) payShortcut.addEventListener('click', ()=> go('agent-commission'));
    root.querySelectorAll('#radius-chips [data-radius]').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        currentUser.serviceRadius = Number(chip.getAttribute('data-radius'));
        saveCurrentAgentUser();
        go('agent-dashboard', {replace:true});
      });
    });
    if(active){ root.querySelector('#go-active-btn').addEventListener('click', ()=>{ currentOrderId = active.id; go('agent-active-errand'); }); }
    const plist = root.querySelector('#pending-list');
    if(!currentUser.online){
      plist.innerHTML = `<div class="empty-state"><div class="empty-icon">${ICON.orders}</div><p>Go online to see errand requests near you.</p></div>`;
    } else if(!pending.length){
      plist.innerHTML = `<div class="empty-state"><div class="empty-icon">${ICON.orders}</div><p>No pending requests right now.</p></div>`;
    } else {
      plist.innerHTML = pending.map(pendingErrandCardHTML).join('');
      wirePendingCards(plist);
    }
  };

  SCREENS['agent-errands'] = function(root){

    root.innerHTML = pageHeader('Available Errands') +
      (currentUser.online ? '' : `<div class="suitability-note">You're offline — go online from your dashboard to receive new errand requests.</div>`) +
      `<div id="agent-errands-list"></div>`;

    list.innerHTML = pending.map(pendingErrandCardHTML).join('');
    wirePendingCards(list);
  };

    root.innerHTML = pageHeader('New Errand Request') + `
      <div class="active-errand-card" style="margin-bottom:20px;">
        <p style="font-size:13.5px;color:var(--text-secondary);margin:0 0 16px;">${escHtml(e.buyerName||'A customer')} selected you to handle this errand.</p>
        <div class="review-block">
          <div class="review-row"><span class="r-label">Item</span><span class="r-value">${escHtml(e.itemName)}</span></div>
          <div class="review-row"><span class="r-label">Quantity</span><span class="r-value">${e.quantity}</span></div>
          <div class="review-row"><span class="r-label">Merchant</span><span class="r-value">${escHtml(e.sellerName)}</span></div>
          <div class="review-row"><span class="r-label">Pickup</span><span class="r-value">${escHtml(e.sellerAddress)}</span></div>
          <div class="review-row"><span class="r-label">Delivery</span><span class="r-value">${escHtml(e.deliveryAddress)}</span></div>
          ${e.description ? `<div class="review-row"><span class="r-label">Instructions</span><span class="r-value">${escHtml(e.description)}</span></div>` : ''}
          <div class="review-row"><span class="r-label">Estimated Item Cost</span><span class="r-value">${fmtNaira(e.estimatedPrice)}</span></div>
          <div class="review-row"><span class="r-label">Agent Fee</span><span class="r-value price-strong">${fmtNaira(e.agentFee)}</span></div>
        </div>
        <div style="display:flex;gap:12px;margin-top:18px;">
          <button class="btn btn-primary" id="accept-errand-btn">Accept Errand</button>
          <button class="btn btn-outline" id="decline-errand-btn">Decline</button>
        </div>
      </div>
    `;
    wirePageBack(root);
    root.querySelector('#accept-errand-btn').addEventListener('click', ()=>{
      agentAdvanceStatus(e, 'AGENT_CONFIRMED');
      e.agentConfirmed = true;
      const store = findStore(e.sellerId);
      if(store && store.isRealMerchant){
        agentAdvanceStatus(e, 'MERCHANT_CONFIRMATION_REQUIRED');
        pushNotificationFor(store.id, 'New Errand Request', (e.buyerName||'A customer') + ' needs ' + e.itemName + ' confirmed.', 'new-request');
      }
      saveErrands();
      if(e.buyerId) pushNotificationFor(e.buyerId, 'Agent Confirmed', (currentUser.fullName||'Your agent') + ' confirmed your errand and is getting started.', 'agent');
      toast('Errand accepted.');
      currentOrderId = e.id;
      go('agent-active-errand', {replace:true});
    });
    root.querySelector('#decline-errand-btn').addEventListener('click', ()=>{
      e.status = 'AGENT_CANCELLED';
      pushHistory(e, 'AGENT_CANCELLED', 'Declined by agent');
      saveErrands();
      if(e.buyerId) pushNotificationFor(e.buyerId, 'Agent Unavailable', (currentUser.fullName||'Your agent') + ' was unable to accept this errand.', 'agent');
      toast('Errand declined.');
      go('agent-dashboard', {replace:true});
    });
  };

          <div class="avatar">${initials(e.buyerName||'C')}</div>

  function agentMerchantCardHTML(e){

      <div class="active-errand-card" style="margin-bottom:14px;">
        <div class="section-heading" style="margin-top:0;"><h2>Pickup From</h2></div>
        <div style="display:flex;align-items:center;gap:14px;">
          <div class="seller-icon">${ICON.store}</div>

  function cancelErrandBlockHTML(){
    return `
      <button class="btn btn-outline" id="open-cancel-btn" style="border-color:var(--danger);color:var(--danger);margin-top:8px;">Cancel Errand</button>
      <div id="cancel-panel" class="hidden active-errand-card" style="margin-top:14px;">
        <div class="section-heading" style="margin-top:0;"><h2>Cancel Errand</h2></div>
        <p style="font-size:13px;color:var(--text-secondary);margin:0 0 12px;">Please tell us why — this helps keep the platform reliable.</p>
        <div class="chip-select" id="cancel-reason-chips">
          ${['Emergency','Vehicle problem','Merchant unavailable','Customer issue','Cannot complete errand','Other'].map(r=>`<span class="chip-option" data-reason="${r}">${r}</span>`).join('')}
        </div>
        <button class="btn btn-primary" id="confirm-cancel-btn" style="margin-top:14px;" disabled>Confirm Cancellation</button>
      </div>
    `;
  }
  function wireCancelBlock(root, e){
    const openBtn = root.querySelector('#open-cancel-btn');
    const panel = root.querySelector('#cancel-panel');
    if(!openBtn) return;
    openBtn.addEventListener('click', ()=> panel.classList.toggle('hidden'));
    let reason = null;
    const confirmBtn = root.querySelector('#confirm-cancel-btn');
    root.querySelectorAll('#cancel-reason-chips [data-reason]').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        root.querySelectorAll('#cancel-reason-chips [data-reason]').forEach(c=>c.classList.remove('selected'));
        chip.classList.add('selected');
        reason = chip.getAttribute('data-reason');
        confirmBtn.disabled = false;
      });
    });
    confirmBtn.addEventListener('click', ()=>{
      e.status = 'AGENT_CANCELLED';
      e.cancelReason = reason;
      pushHistory(e, 'AGENT_CANCELLED', reason);
      saveErrands();
      currentUser.cancelRate = Math.min(100, (currentUser.cancelRate||0) + 1);
      saveCurrentAgentUser();
      if(e.buyerId) pushNotificationFor(e.buyerId, 'Errand Cancelled', (currentUser.fullName||'Your agent') + ' had to cancel this errand: ' + reason + '.', 'agent');
      toast('Errand cancelled.');
      go('agent-dashboard', {replace:true});
    });
  }

  function renderAgentActive(root, e){
    if(!e){ root.innerHTML = pageHeader('Active Errand'); wirePageBack(root); return; }
    if(!e.otp && e.status === 'ARRIVED_AT_CUSTOMER'){ e.otp = String(Math.floor(1000+Math.random()*9000)); saveErrands(); }

    let actionHTML = '';
    if(TERMINAL_STATUSES.includes(e.status)){
      const label = e.status === 'COMPLETED' ? 'Errand Completed ✓' : STATUS_META[e.status] || e.status;
      actionHTML = `
        <div class="active-errand-card" style="text-align:center;">
          <div class="success-badge">${ICON.check}</div>
          <h2 style="font-family:var(--font-display);color:var(--denim);margin:0 0 6px;">${label}</h2>
          ${e.cancelReason ? `<p class="screen-sub">Reason: ${escHtml(e.cancelReason)}</p>` : ''}

        </div>
      `;
    } else if(['MERCHANT_CONFIRMATION_REQUIRED','MERCHANT_CONFIRMED','PREPARING'].includes(e.status) || (e.status === 'PRICE_CHANGE_REQUESTED' && e.priceChange && e.priceChange.by === 'merchant')){
      const waitMsg = {
        MERCHANT_CONFIRMATION_REQUIRED: 'Waiting for the merchant to confirm the item and price.',
        MERCHANT_CONFIRMED: 'The merchant confirmed the item. Waiting for them to start preparing it.',

      actionHTML = `
        <div class="active-errand-card">
          <div class="section-heading" style="margin-top:0;"><h2>${escHtml(e.sellerName)} is handling this order</h2></div>
          <p style="font-size:13px;color:var(--text-secondary);margin:0;">${waitMsg}</p>
        </div>
        ${cancelErrandBlockHTML()}
      `;
    } else if(e.status === 'READY_FOR_PICKUP'){
      actionHTML = `<div class="payment-note" style="margin-bottom:12px;"><strong>Order ready.</strong> ${escHtml(e.sellerName)} has your order ready for pickup.</div><button class="btn btn-primary status-ladder-btn" data-advance="GOING_TO_SELLER">I'm On My Way</button>` + cancelErrandBlockHTML();

      actionHTML = `
        <div class="active-errand-card">
          <div class="section-heading" style="margin-top:0;"><h2>You've arrived at the merchant</h2></div>

        </div>

    } else if(e.status === 'AGENT_CONFIRMED'){
      actionHTML = `<button class="btn btn-primary status-ladder-btn" data-advance="GOING_TO_SELLER">I'm On My Way</button>` + cancelErrandBlockHTML();
    } else if(e.status === 'GOING_TO_SELLER'){
      const realMerchant = !!(findStore(e.sellerId) && findStore(e.sellerId).isRealMerchant);
      actionHTML = `<button class="btn btn-primary status-ladder-btn" data-advance="${realMerchant?'AGENT_ARRIVED':'ARRIVED_AT_SELLER'}">I've Arrived</button>` + cancelErrandBlockHTML();
    } else if(e.status === 'ARRIVED_AT_SELLER'){
      actionHTML = `
        <div class="active-errand-card">
          <div class="section-heading" style="margin-top:0;"><h2>You've arrived at the merchant</h2></div>
          <div class="review-block">
            <div class="review-row"><span class="r-label">Item</span><span class="r-value">${escHtml(e.itemName)}</span></div>
            <div class="review-row"><span class="r-label">Quantity</span><span class="r-value">${e.quantity}</span></div>
            <div class="review-row"><span class="r-label">Estimated Price</span><span class="r-value">${fmtNaira(e.estimatedPrice)}</span></div>
          </div>
          <div class="field" style="margin-top:14px;"><label for="actual-price">Actual price at the store (₦)</label><input id="actual-price" type="text" value="${e.estimatedPrice}"></div>
          <button class="btn btn-primary" id="confirm-item-btn" style="margin-top:6px;">Confirm Item</button>
          <button class="btn btn-outline" id="item-unavailable-btn" style="margin-top:10px;">Item Unavailable</button>
        </div>
        ${cancelErrandBlockHTML()}
      `;
    } else if(e.status === 'PRICE_CHANGE_REQUESTED'){
      const pc = e.priceChange || {};
      if(pc.status === 'approved'){
        actionHTML = `
          <div class="active-errand-card">
            <div class="section-heading" style="margin-top:0;"><h2>Price Approved</h2></div>
            <p style="font-size:13px;color:var(--text-secondary);margin:0 0 14px;">${escHtml(e.buyerName||'The customer')} approved the new price of ${fmtNaira(pc.actual||e.estimatedPrice)}. You can continue the errand.</p>
            <button class="btn btn-primary" id="continue-after-price-btn">Continue — Confirm Item</button>
          </div>
        `;

        actionHTML = `
          <div class="active-errand-card">
            <div class="section-heading" style="margin-top:0;"><h2>Price Rejected</h2></div>
            <p style="font-size:13px;color:var(--text-secondary);margin:0 0 14px;">${escHtml(e.buyerName||'The customer')} rejected the new price of ${fmtNaira(pc.actual||e.estimatedPrice)}. Contact them or cancel this errand.</p>
            <button class="btn btn-outline" id="cust-chat-btn-pc">Message Customer</button>
          </div>
          ${cancelErrandBlockHTML()}
        `;
      } else {
        actionHTML = `
          <div class="active-errand-card">
            <div class="section-heading" style="margin-top:0;"><h2>Price Changed</h2></div>
            <div class="review-block">
              <div class="review-row"><span class="r-label">Estimated</span><span class="r-value">${fmtNaira(pc.estimated||e.estimatedPrice)}</span></div>
              <div class="review-row"><span class="r-label">Actual</span><span class="r-value">${fmtNaira(pc.actual||e.estimatedPrice)}</span></div>
              <div class="review-row"><span class="r-label">Difference</span><span class="r-value price-strong">${fmtNaira((pc.actual||0)-(pc.estimated||0))}</span></div>
            </div>
            <p style="font-size:13px;color:var(--text-secondary);margin:14px 0;">Waiting for ${escHtml(e.buyerName||'the customer')} to approve the new price before you proceed.</p>
            <button class="btn btn-outline" id="simulate-approval-btn">Simulate Customer Approval (demo)</button>
          </div>
        `;
      }
    } else if(e.status === 'ITEM_CONFIRMED'){
      actionHTML = `
        <div class="active-errand-card">
          <div class="section-heading" style="margin-top:0;"><h2>Pickup Photo</h2></div>

          <button class="btn btn-primary" id="confirm-pickup-btn" style="margin-top:14px;">Picked Up Item</button>
        </div>

      actionHTML = `<button class="btn btn-primary status-ladder-btn" data-advance="IN_TRANSIT">Start Delivery</button>` + cancelErrandBlockHTML();
    } else if(e.status === 'IN_TRANSIT'){

          <p style="font-size:13px;color:var(--text-secondary);">Ask ${escHtml(e.buyerName||'the customer')} for their delivery code.</p>

            <div class="file-drop-text"><strong>${e.deliveryPhoto?'Photo added':'Add delivery photo'}</strong>Optional proof of delivery</div>
          </div>
          <button class="btn btn-primary" id="confirm-delivery-btn" style="margin-top:14px;">Confirm Delivery</button>
        </div>
        <button class="btn btn-outline" id="customer-unavailable-btn" style="margin-top:10px;">Customer Unavailable</button>
      `;
    } else if(e.status === 'DELIVERED'){
      if(e.paymentConfirmed){
        actionHTML = `
          <div class="active-errand-card" style="text-align:center;">
            <div class="success-badge">${ICON.check}</div>
            <h2 style="font-family:var(--font-display);color:var(--denim);margin:0 0 6px;">Payment Confirmed</h2>

        actionHTML = `
          <div class="active-errand-card">

            </div>
          </div>
        `;
      }

    root.innerHTML = pageHeader('Active Errand') + `
      <div class="tracking-status-card">
        <div class="tracking-status-icon">${ICON.runner}</div>
        <div>
          <div style="font-weight:700;font-size:14.5px;color:var(--text);">${escHtml(e.itemName)}</div>

    root.querySelectorAll('[data-advance]').forEach(btn=>{

      });
    });
    wireCancelBlock(root, e);

    const confirmItemBtn = root.querySelector('#confirm-item-btn');
    if(confirmItemBtn) confirmItemBtn.addEventListener('click', ()=>{
      const actual = Number(root.querySelector('#actual-price').value) || e.estimatedPrice;
      if(actual !== e.estimatedPrice){
        e.priceChange = { estimated: e.estimatedPrice, actual, status:'requested' };
        e.status = 'PRICE_CHANGE_REQUESTED';
        pushHistory(e, 'PRICE_CHANGE_REQUESTED');
        saveErrands();
        if(e.buyerId) pushNotificationFor(e.buyerId, 'Price Change Requested', 'Your agent found a different price at the store and needs your approval.', 'price-change');

      } else {
        agentAdvanceStatus(e, 'ITEM_CONFIRMED');
      }
      renderAgentActive(document.getElementById('app-content'), e);
    });
    const itemUnavailBtn = root.querySelector('#item-unavailable-btn');
    if(itemUnavailBtn) itemUnavailBtn.addEventListener('click', ()=>{
      e.status = 'ITEM_UNAVAILABLE';
      pushHistory(e, 'ITEM_UNAVAILABLE');
      saveErrands();
      if(e.buyerId) pushNotificationFor(e.buyerId, 'Item Unavailable', 'The merchant did not have your item in stock. Please review your errand.', 'agent');

      go('agent-dashboard', {replace:true});

  SCREENS['agent-chat'] = function(root){
    const errand = errands.find(e=>e.id===currentChatErrandId);
    if(!errand){ root.innerHTML = pageHeader('Chat'); wirePageBack(root); return; }
    errand.messages = errand.messages || [];
    root.innerHTML = pageHeader('Chat') + `
      <div class="chat-shell">
        <div class="chat-header">
          <div class="avatar">${initials(errand.buyerName||'C')}</div>
          <div style="flex:1;"><div class="agent-name">${escHtml(errand.buyerName||'Customer')}</div><span class="online-dot"><span class="dot"></span>Customer</span></div>
          <button class="icon-btn" id="chat-call-btn" title="Call">${ICON.phone}</button>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-bar" id="chat-input-row">
          <button class="chat-icon-btn" id="chat-attach-btn" title="Attachment">${ICON.image}</button>
          <button class="chat-icon-btn" id="chat-mic-btn" title="Voice note">${ICON.mic}</button>
          <input type="text" id="chat-input" placeholder="Type a message...">
          <button class="chat-send-btn" id="chat-send-btn">${ICON.send}</button>
        </div>
        <div class="chat-record-bar" id="chat-record-bar">
          <span class="record-dot"></span>
          <span class="record-time" id="record-time-label">Recording 0:00</span>
          <button class="record-cancel-btn" id="record-cancel-btn" title="Cancel">✕</button>
          <button class="record-send-btn" id="record-send-btn" title="Send">${ICON.send}</button>
        </div>
        <input type="file" id="chat-file-input" accept="image/*" style="display:none;">
      </div>
    `;
    wirePageBack(root);
    const msgBox = root.querySelector('#chat-messages');
    function paintMessages(){
      msgBox.innerHTML = errand.messages.map(m=>{
        const type = m.type || 'text';
        const mine = m.sender === 'agent';
        if(type === 'system'){ return `<div class="chat-system-msg">${escHtml(m.text)}</div>`; }
        let inner;
        if(type === 'image'){ inner = `<div class="chat-image-msg"><img src="${m.imageUrl}" alt="attachment"></div>`; }
        else if(type === 'voice'){
          inner = `<div class="voice-msg" data-voice="${m.id}" data-duration="${m.duration}"><button class="voice-play-btn" data-play="${m.id}">▶</button><div class="voice-progress-track"><div class="voice-progress-fill" id="fill-${m.id}"></div></div><span class="voice-duration">0:${String(m.duration).padStart(2,'0')}</span></div>`;
        } else { inner = escHtml(m.text); }
        return `<div class="chat-bubble-wrap ${mine?'buyer':'agent'}"><div class="chat-bubble">${inner}</div><div class="chat-time">${new Date(m.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div></div>`;
      }).join('');
      msgBox.scrollTop = msgBox.scrollHeight;
      msgBox.querySelectorAll('[data-play]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const id = btn.getAttribute('data-play');
          const m = errand.messages.find(x=>x.id===id);
          const fill = document.getElementById('fill-'+id);
          if(!m || !fill || btn.disabled) return;
          btn.disabled = true;
          const totalMs = Math.max(1, m.duration) * 1000;
          const start = Date.now();
          const t = setInterval(()=>{
            const pct = Math.min(100, ((Date.now()-start)/totalMs)*100);
            fill.style.width = pct + '%';
            if(pct >= 100){ clearInterval(t); btn.disabled = false; fill.style.width = '0%'; }
          }, 80);
        });
      });
    }
    paintMessages();
    root.querySelector('#chat-call-btn').addEventListener('click', ()=> openCallOverlay({ name: errand.buyerName || 'Customer' }));
    const fileInput = root.querySelector('#chat-file-input');
    root.querySelector('#chat-attach-btn').addEventListener('click', ()=> fileInput.click());
    fileInput.addEventListener('change', ()=>{
      const file = fileInput.files && fileInput.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{ errand.messages.push({ id:'m_'+Date.now(), sender:'agent', type:'image', imageUrl: reader.result, time:new Date().toISOString() }); saveErrands(); paintMessages(); };
      reader.readAsDataURL(file);
      fileInput.value = '';
    });
    const recordBar = root.querySelector('#chat-record-bar');
    const inputRow = root.querySelector('#chat-input-row');
    let recordSeconds = 0;
    function updateRecordLabel(){ const m=Math.floor(recordSeconds/60), s=recordSeconds%60; root.querySelector('#record-time-label').textContent = `Recording ${m}:${String(s).padStart(2,'0')}`; }
    function startRecording(){ recordSeconds=0; updateRecordLabel(); inputRow.style.display='none'; recordBar.classList.add('active'); recordTimer=setInterval(()=>{ recordSeconds++; updateRecordLabel(); },1000); }
    function stopRecording(){ if(recordTimer){ clearInterval(recordTimer); recordTimer=null; } recordBar.classList.remove('active'); inputRow.style.display='flex'; }
    root.querySelector('#chat-mic-btn').addEventListener('click', startRecording);
    root.querySelector('#record-cancel-btn').addEventListener('click', stopRecording);
    root.querySelector('#record-send-btn').addEventListener('click', ()=>{
      const duration = Math.max(1, recordSeconds);
      stopRecording();
      errand.messages.push({ id:'m_'+Date.now(), sender:'agent', type:'voice', duration, time:new Date().toISOString() });
      saveErrands(); paintMessages();
    });
    function send(){
      const input = root.querySelector('#chat-input');
      const text = input.value.trim();
      if(!text) return;
      errand.messages.push({ id:'m_'+Date.now(), sender:'agent', type:'text', text, time:new Date().toISOString() });
      saveErrands(); input.value=''; paintMessages();
    }
    root.querySelector('#chat-send-btn').addEventListener('click', send);
    root.querySelector('#chat-input').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ send(); } });
  };
